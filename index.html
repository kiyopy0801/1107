<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>小金井市 水害サバイバルクイズ</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;background:#0b2a45;color:#1d2b36;min-height:100vh;transition:background .4s}
  body.en{font-family:"Helvetica Neue","Segoe UI",Arial,"Hiragino Sans",sans-serif}
  body.oni{background:#140507}
  button{-webkit-appearance:none;appearance:none;color:inherit}
  ruby rt{font-size:.45em;font-weight:normal;letter-spacing:-.06em}
  .app{max-width:1000px;margin:0 auto;padding:18px;min-height:100vh;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column;animation:fade .35s ease;position:relative}
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  h1{font-size:34px;color:#fff;text-align:center;line-height:1.6}
  .sub{color:#cfe3f5;text-align:center;font-size:18px;margin:10px 0 18px;line-height:2}
  .start-hero{border-radius:18px;overflow:hidden;margin-bottom:18px;line-height:0}
  .btn{display:block;width:100%;border:none;border-radius:14px;font-size:21px;font-weight:bold;padding:16px;cursor:pointer;font-family:inherit;line-height:1.8}
  .btn-primary{background:#ff8a00;color:#fff;-webkit-text-fill-color:#fff;box-shadow:0 5px 0 #c26900}
  .btn-primary:active{transform:translateY(3px);box-shadow:0 2px 0 #c26900}
  .btn-sub{background:#e3e8ee;color:#0b2a45;-webkit-text-fill-color:#0b2a45;box-shadow:0 5px 0 #b3c0cc}
  .head-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:6px;min-height:38px;flex-wrap:wrap}
  #s-start .head-row{justify-content:space-between}
  .lang{display:inline-flex;border:2px solid rgba(255,255,255,.45);border-radius:22px;overflow:hidden}
  .lang button{background:transparent;border:none;color:#fff;-webkit-text-fill-color:#fff;padding:6px 14px;font-size:15px;font-weight:bold;font-family:inherit;cursor:pointer}
  .lang button.on{background:#fff;color:#0b2a45;-webkit-text-fill-color:#0b2a45}
  .lang-ic{color:#fff;font-size:18px;margin-right:6px}
  .furi,.snd{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.45);color:#fff;-webkit-text-fill-color:#fff;border-radius:22px;padding:6px 12px;font-size:15px;font-family:inherit;cursor:pointer;white-space:nowrap;font-weight:bold}
  .furi.on{background:#ffd60a;color:#0b2a45;-webkit-text-fill-color:#0b2a45;border-color:#ffd60a}
  body.en .furi{display:none}
  .lv-label{color:#fff;font-size:22px;font-weight:bold;text-align:center;margin:4px 0 12px;line-height:1.8}
  .lv-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .lv-btn{border:none;border-radius:18px;padding:18px 12px;cursor:pointer;font-family:inherit;text-align:center;line-height:1.7;color:#fff;-webkit-text-fill-color:#fff}
  .lv-btn .n{font-size:30px;font-weight:900;display:block;line-height:1.6}
  .lv-btn .d{font-size:14px;display:block;margin-top:4px;line-height:1.9}
  .lv-easy{background:#38b000;box-shadow:0 6px 0 #237000}
  .lv-hard{background:#d62828;box-shadow:0 6px 0 #8b0000}
  .lv-oni{background:linear-gradient(160deg,#1a1a1a,#3b0000);box-shadow:0 6px 0 #000,0 0 0 2px #d62828 inset}
  .lv-oni .n{color:#ff3b3b;-webkit-text-fill-color:#ff3b3b;letter-spacing:.05em;text-shadow:0 0 12px rgba(255,0,0,.6)}
  .lv-btn:active{transform:translateY(4px);box-shadow:none}
  .lvtag{display:inline-block;font-size:16px;padding:3px 14px;border-radius:16px;color:#fff;margin-bottom:6px;line-height:1.8}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .sc-btn{background:#fff;border:4px solid transparent;border-radius:16px;padding:18px 10px;text-align:center;cursor:pointer;font-family:inherit;transition:.15s;color:#0b2a45}
  .sc-btn:active{border-color:#ff8a00;transform:scale(.97)}
  .sc-btn .ic{font-size:52px}
  .sc-btn .t{font-size:20px;font-weight:bold;margin-top:6px;color:#0b2a45;-webkit-text-fill-color:#0b2a45;line-height:1.8}
  .sc-btn .d{font-size:14px;color:#3d4f61;-webkit-text-fill-color:#3d4f61;margin-top:4px;line-height:1.8}
  body.oni .sc-btn{background:#241012;border-color:#5a1a1a}
  body.oni .sc-btn .t{color:#ffdada;-webkit-text-fill-color:#ffdada}
  body.oni .sc-btn .d{color:#d8a8a8;-webkit-text-fill-color:#d8a8a8}
  .back{background:none;border:none;color:#9db7cf;-webkit-text-fill-color:#9db7cf;font-size:17px;margin-top:16px;cursor:pointer;font-family:inherit;text-decoration:underline}
  .topbar{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .topbar .sc{font-size:18px;font-weight:bold;line-height:1.8}
  .progress{flex:1;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;min-width:80px;max-width:300px}
  .progress div{height:100%;background:#ff8a00;transition:width .4s}
  body.oni .progress div{background:#ff2a2a}
  .qno{font-size:18px;font-weight:bold;white-space:nowrap;line-height:1.8}
  .tools{display:flex;gap:6px}
  .scene{width:100%;border-radius:16px;overflow:hidden;background:#000;line-height:0;position:relative}
  .scene svg,.scene img,.scene video{width:100%;height:auto;display:block}
  .scene.shake{animation:shake .5s infinite}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
  .rainfall{animation:fall .38s linear infinite}
  @keyframes fall{from{transform:translate(0,-120px)}to{transform:translate(-40px,0)}}
  .wave{animation:wave 2.4s linear infinite}
  .wave.fast{animation-duration:1.1s}
  @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-80px)}}
  .bob{animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .blink{animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.35}}
  .spinw{animation:spinw 14s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spinw{to{transform:rotate(360deg)}}
  .drop{animation:drop 1.4s linear infinite}
  @keyframes drop{from{transform:translate(0,-40px);opacity:1}to{transform:translate(-30px,120px);opacity:.2}}
  .pour{animation:pour .6s linear infinite}
  @keyframes pour{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
  .flash{opacity:0;transition:opacity .08s}
  .flash.on{opacity:.75}
  .situation{background:#fff6e0;border-left:8px solid #ff8a00;border-radius:10px;padding:12px 16px;margin:14px 0 10px;font-size:19px;line-height:2;color:#1d2b36}
  body.en .situation{line-height:1.6}
  body.oni .situation{background:#2a0e10;border-left-color:#ff2a2a;color:#ffe3e3}
  .question{font-size:24px;font-weight:bold;color:#fff;margin:6px 2px 12px;line-height:2}
  .choices{display:flex;flex-direction:column;gap:12px}
  .choice{background:#fff;border:none;border-radius:14px;padding:16px 18px 16px 64px;font-size:19px;font-weight:600;text-align:left;position:relative;cursor:pointer;font-family:inherit;line-height:2;box-shadow:0 4px 0 #9fb3c4;color:#1a1a1a;-webkit-text-fill-color:#1a1a1a}
  body.en .choice{line-height:1.5}
  .choice:active{transform:translateY(3px);box-shadow:0 1px 0 #9fb3c4;background:#ffe7c7}
  .choice .lb{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:#0b2a45;color:#fff;-webkit-text-fill-color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
  body.oni .choice .lb{background:#8b0000}
  #s-drama{justify-content:center}
  .drama-title{color:#fff;font-size:26px;font-weight:bold;text-align:center;margin-bottom:12px;letter-spacing:.1em;line-height:2}
  body.en .drama-title{letter-spacing:.02em}
  .drama-title.beat{animation:beat .8s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
  .drama-wrap{position:relative}
  .caption{position:absolute;left:0;right:0;bottom:18px;text-align:center;line-height:1.9;pointer-events:none}
  .caption span{display:inline-block;background:rgba(0,0,0,.6);color:#fff;font-size:32px;font-weight:900;padding:6px 26px;border-radius:12px;opacity:0;animation:capin .8s ease forwards .6s}
  @keyframes capin{to{opacity:1}}
  .rise{animation:rise 3.8s cubic-bezier(.5,0,.8,.6) forwards}
  @keyframes rise{from{transform:translateY(0)}to{transform:translateY(-340px)}}
  .fadeout{animation:fadeout 3s ease forwards}
  @keyframes fadeout{to{opacity:0}}
  .fadein{opacity:0;animation:fadein 2s ease forwards 1.2s}
  @keyframes fadein{to{opacity:1}}
  .drift{animation:drift 6s ease-out forwards}
  @keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(70px)}}
  .rock{animation:rock 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
  @keyframes rock{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-5px)}}
  .waveArm{animation:waveArm .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left bottom}
  @keyframes waveArm{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
  .float{animation:float 6s ease-in-out forwards}
  @keyframes float{from{transform:translate(-60px,-30px)}to{transform:translate(80px,30px)}}
  .spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{from{transform:rotate(-20deg)}to{transform:rotate(30deg)}}
  .swimR{animation:swimR linear infinite}
  .swimL{animation:swimL linear infinite}
  @keyframes swimR{from{transform:translateX(-120px)}to{transform:translateX(780px)}}
  @keyframes swimL{from{transform:translateX(780px)}to{transform:translateX(-120px)}}
  .bubble{animation:bubble linear infinite}
  @keyframes bubble{from{transform:translateY(0);opacity:.8}to{transform:translateY(-380px);opacity:0}}
  .sway{animation:sway 3s ease-in-out infinite alternate}
  @keyframes sway{from{opacity:.05}to{opacity:.16}}
  .darken{opacity:0;animation:darken 5.5s ease forwards .5s}
  @keyframes darken{to{opacity:.5}}
  .result-head{text-align:center;padding:26px 16px;border-radius:18px;color:#fff;line-height:1.8}
  .pass{background:linear-gradient(135deg,#1e9e5a,#38c172)}
  .fail{background:linear-gradient(135deg,#8b0000,#d62828);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(214,40,40,.7)}50%{box-shadow:0 0 0 14px rgba(214,40,40,0)}}
  .score{font-size:84px;font-weight:900;line-height:1.1}
  .score small{font-size:30px}
  .verdict{font-size:30px;font-weight:bold;margin-top:8px;line-height:1.8}
  .warn{font-size:19px;margin-top:10px;line-height:2}
  .review{margin-top:16px}
  .review h3{font-size:21px;margin-bottom:10px;color:#0b2a45;line-height:1.9}
  .rv{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #e3e8ee;font-size:17px;line-height:2;color:#1d2b36}
  body.en .rv{line-height:1.6}
  .rv:last-child{border-bottom:none}
  .rv .sit{display:block;font-size:15px;color:#5b6b7a;margin-bottom:2px}
  .mk{flex:0 0 46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#fff}
  .mk.g{background:#1e9e5a}.mk.m{background:#f0a500}.mk.b{background:#d62828}
  .rv b{color:#0b2a45}
  .adv{color:#a33a00}
  .btn-row{display:flex;gap:12px;margin-top:18px}
  .note{color:#9db7cf;font-size:13px;text-align:center;margin-top:16px;line-height:2}
  @media (max-width:520px){h1{font-size:27px}.question{font-size:21px}.choice{font-size:17px}.situation{font-size:17px}.btn-row{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <section class="screen active" id="s-start">
    <div class="head-row">
      <div><span class="lang-ic">🌐</span><span class="lang"><button type="button" data-lang="ja" onclick="setLang('ja')"></button><button type="button" data-lang="en" onclick="setLang('en')"></button></span></div>
      <button class="furi" onclick="toggleFuri()"></button>
    </div>
    <h1>🌧️ <span data-k="common.title"></span></h1>
    <p class="sub" data-k="common.sub"></p>
    <div class="start-hero" id="hero"></div>
    <div class="lv-label" data-k="common.lvLabel"></div>
    <div class="lv-row">
      <button class="lv-btn lv-easy" onclick="chooseLevel('easy')"><span class="n" data-k="common.easyN"></span><span class="d" data-k="common.easyD"></span></button>
      <button class="lv-btn lv-hard" onclick="chooseLevel('hard')"><span class="n" data-k="common.hardN"></span><span class="d" data-k="common.hardD"></span></button>
      <button class="lv-btn lv-oni" onclick="chooseLevel('oni')"><span class="n">👹 <span data-k="common.oniN"></span></span><span class="d" data-k="common.oniD"></span></button>
    </div>
    <p class="note" data-k="common.note"></p>
  </section>
  <section class="screen" id="s-select">
    <div class="head-row"><button class="furi" onclick="toggleFuri()"></button></div>
    <div style="text-align:center"><span class="lvtag" id="sel-tag"></span></div>
    <h1 style="font-size:28px" id="sel-h"></h1>
    <p class="sub" id="sel-sub"></p>
    <div class="grid" id="sc-grid"></div>
    <button class="back" id="sel-back" onclick="go('s-start')"></button>
  </section>
  <section class="screen" id="s-quiz">
    <div class="topbar">
      <div class="sc" id="q-sc"></div>
      <div class="progress"><div id="q-bar"></div></div>
      <div class="qno" id="q-no"></div>
      <div class="tools"><button class="snd" id="snd-btn" onclick="toggleSound()"></button><button class="furi" onclick="toggleFuri()"></button></div>
    </div>
    <div class="scene" id="q-scene"></div>
    <div class="situation" id="q-sit"></div>
    <div class="question" id="q-text"></div>
    <div class="choices" id="q-choices"></div>
  </section>
  <section class="screen" id="s-drama">
    <div class="drama-title beat" id="d-title"></div>
    <div class="drama-wrap"><div class="scene" id="d-scene"></div><div class="caption" id="d-cap"></div></div>
  </section>
  <section class="screen" id="s-result">
    <div class="head-row"><button class="furi" onclick="toggleFuri()"></button></div>
    <div class="result-head" id="r-head"></div>
    <div class="card review"><h3 id="r-h3"></h3><div id="r-list"></div></div>
    <div class="btn-row">
      <button class="btn btn-sub" id="r-again" onclick="go('s-select')"></button>
      <button class="btn btn-primary" id="r-top" onclick="go('s-start')"></button>
    </div>
  </section>
</div>
<script>
const DATA_JA={"easy": [{"id": "home", "icon": "🏠", "title": "家《いえ》にいるとき", "desc": "2階建《かいだ》ての家《いえ》で家族《かぞく》と過《す》ごしている", "nodes": {"1": {"c": [{"t": "家族《かぞく》とハザードマップを見《み》て、逃《に》げる場所《ばしょ》をたしかめる", "s": 2}, {"t": "テレビをつけて、様子《ようす》を見《み》る", "s": 1}, {"t": "外《そと》に出《で》て、川《かわ》の様子《ようす》を見《み》に行《い》く", "s": 0}], "scene": {"type": "house", "rain": 2, "depth": 0, "alert": "warn", "extra": ["hazard"]}, "sit": "夕方《ゆうがた》、雨《あめ》が強《つよ》くなり「大雨警報《おおあめけいほう》」が出《で》ました。夜《よる》はもっと強《つよ》くなるそうです。", "q": "まず何《なに》をする？", "tip": "雨《あめ》が強《つよ》くなる前《まえ》に、逃《に》げる場所《ばしょ》を家族《かぞく》で決《き》めておこう！"}, "2g": {"c": [{"t": "おばあちゃんといっしょに、明《あか》るいうちに早《はや》めに逃《に》げる", "s": 2}, {"t": "荷物《にもつ》をまとめて、次《つぎ》の知《し》らせを待《ま》つ", "s": 1}, {"t": "まだ大丈夫《だいじょうぶ》だと思《おも》って、ゲームを続《つづ》ける", "s": 0}], "scene": {"type": "house", "rain": 3, "depth": 0, "alert": "l3", "extra": ["grandma"]}, "sit": "逃《に》げる場所《ばしょ》を決《き》めたところで「警戒《けいかい》レベル3」が出《で》ました。家《いえ》には足《あし》の弱《よわ》いおばあちゃんがいます。", "q": "どうする？", "tip": "レベル3は「お年寄《としよ》りは逃《に》げ始《はじ》めて」の合図《あいず》。早《はや》めに動《うご》こう！"}, "2m": {"c": [{"t": "すぐにハザードマップで逃《に》げる場所《ばしょ》を調《しら》べ、おばあちゃんと早《はや》めに逃《に》げる", "s": 2}, {"t": "家族《かぞく》が帰《かえ》ってくるまで待《ま》つ", "s": 1}, {"t": "テレビで「避難指示《ひなんしじ》」が出《で》るまで、何《なに》もしない", "s": 0}], "scene": {"type": "house", "rain": 3, "depth": 0, "alert": "l3", "extra": ["grandma"]}, "sit": "テレビを見《み》ていたら「警戒《けいかい》レベル3」が出《で》ました。逃《に》げる場所《ばしょ》はまだ決《き》めていません。足《あし》の弱《よわ》いおばあちゃんもいます。", "q": "どうする？", "tip": "逃《に》げる場所《ばしょ》がわからないときは、すぐにハザードマップで調《しら》べよう。"}, "2b": {"c": [{"t": "家族《かぞく》に川《かわ》の様子《ようす》を伝《つた》えて、おばあちゃんといっしょにすぐ逃《に》げる", "s": 2}, {"t": "ぬれた服《ふく》を着《き》がえてから、どうするか考《かんが》える", "s": 1}, {"t": "心配《しんぱい》させたくないので、川《かわ》のことは家族《かぞく》にだまっておく", "s": 0}], "scene": {"type": "house", "rain": 3, "depth": 5, "alert": "l3", "extra": ["grandma"]}, "sit": "川《かわ》を見《み》に行《い》ったら、水《みず》がどんどん増《ふ》えていてこわくなり、走《はし》って家《いえ》に帰《かえ》りました。「警戒《けいかい》レベル3」が出《で》ています。", "q": "どうする？", "tip": "見《み》てきた危険《きけん》は、すぐ家族《かぞく》に伝《つた》えよう。早《はや》めに家族《かぞく》と逃《に》げよう。"}, "3g": {"c": [{"t": "受付《うけつけ》をして、家族《かぞく》といっしょにいる場所《ばしょ》を決《き》める", "s": 2}, {"t": "つかれたので、すぐに寝《ね》る", "s": 1}, {"t": "忘《わす》 す。"}, "2g": {"c": [{"t": "祖母《そぼ》を連《つ》れて、まだ動《うご》けるうちに親戚《しんせき》の家《いえ》や避難所《ひなんじょ》へ移動《いどう》を始《はじ》める", "s": 2}, {"t": "祖母《そぼ》を2階《かい》の寝室《しんしつ》に移《うつ》し、家族《かぞく》は避難指示《ひなんしじ》が出《で》たらすぐ動《うご》けるよう準備《じゅんび》する", "s": 1}, {"t": "夜道《よみち》の移動《いどう》は危《あぶ》ないので、避難指示《ひなんしじ》が出《で》るまで全員《ぜんいん》で1階《かい》のリビングで様子《ようす》を見《み》る", "s": 0}], "scene": {"type": "house", "rain": 3, "depth": 0, "alert": "l3", "extra": ["grandma"]}, "sit": "自宅《じたく》付近《ふきん》は<b>最大《さいだい》2〜3mの浸水想定《しんすいそうてい》</b>と確認《かくにん》しました。夜《よる》7時《じ》、<b>警戒《けいかい》レベル3（高齢者等避難《こうれいしゃとうひなん》）</b>が発令《はつれい》。家《いえ》には足《あし》の弱《よわ》い祖母《そぼ》がいます。", "q": "どうする？", "tip": "レベル3は、高齢者《こうれいしゃ》など避難《ひなん》に時間《じかん》がかかる人《ひと》が避難《ひなん》を始《はじ》める段階《だんかい》です。避難指示《ひなんしじ》（レベル4）を待《ま》つと、さらに暗《くら》く雨《あめ》の強《つよ》い中《なか》での移動《いどう》になります。"}, "2m": {"c": [{"t": "ハザードマップで避難先《ひなんさき》と経路《けいろ》を確認《かくにん》し、祖母《そぼ》を連《つ》れてすぐ移動《いどう》を始《はじ》める", "s": 2}, {"t": "避難所《ひなんじょ》の場所《ばしょ》を家族《かぞく》で確認《かくにん》し、避難指示《ひなんしじ》が出《で》たら出発《しゅっぱつ》することにする", "s": 1}, {"t": "避難所《ひなんじょ》は混《こ》むので、自宅《じたく》で様子《ようす》を見《み》ることにする", "s": 0}], "scene": {"type": "house", "rain": 3, "depth": 0, "alert": "l3", "extra": ["grandma"]}, "sit": "持《も》ち出《だ》し袋《ぶくろ》の準備中《じゅんびちゅう》、夜《よる》7時《じ》に<b>警戒《けいかい》レベル3（高齢者等避難《こうれいしゃとうひなん》）</b>が発令《はつれい》。避難先《ひなんさき》はまだ決《き》めていません。足《あし》の弱《よわ》い祖母《そぼ》がいます。", "q": "どうする？", "tip": "準備《じゅんび》ができていても、避難先《ひなんさき》が決《き》まっていなければ動《うご》けません。レベル3は高齢者《こうれいしゃ》が避難《ひなん》を始《はじ》める段階《だんかい》。決《き》めたらすぐ行動《こうどう》に移《うつ》しましょう。"}, "2b": {"c": [{"t": "家族《かぞく》にけがを伝《つた》え、親戚《しんせき》や近所《きんじょ》に避難《ひなん》の手助《てだす》けを早《はや》めに頼《たの》み、祖母《そぼ》とともに移動《いどう》を始《はじ》める", "s": 2}, {"t": "けがの手当《てあ》てをしてから、落《お》ち着《つ》いて今後《こんご》を考《かんが》える", "s": 1}, {"t": "痛《いた》みをこらえて、もう一度《いちど》側溝《そっこう》の詰《つ》まりを取《と》りに出《で》る", "s": 0}], "scene": {"type": "house", "rain": 3, "depth": 10, "alert": "l3", "extra": ["grandma"]}, "sit": "側溝《そっこう》を掃除中《そうじちゅう》、あふれた水《みず》に足《あし》をすくわれて転倒《てんとう》し、足首《あしくび》を痛《いた》めました。<b>警戒《けいかい》レベル3</b>が発令《はつれい》。足《あし》の弱《よわ》い祖母《そぼ》もいます。", "q": "どうする？", "tip": "大雨《おおあめ》の中《なか》の屋外《おくがい》作業《さぎょう》は転倒《てんとう》・転落《てんらく》の危険大《きけんだい》。避難《ひなん》に支援《しえん》が必要《ひつよう》な人《ひと》が増《ふ》えたら、早《はや》めに周囲《しゅうい》へ助《たす》けを求《もと》めることが大切《たいせつ》です。"}, "3g": {"c": [{"t": "受付《うけつけ》で家族《かぞく》の人数《にんずう》と、祖母《そぼ》に必要《ひつよう》な配慮《はいりょ》（持病《じびょう》・介助《かいじょ》）を伝《つた》える", "s": 2}, {"t": "混《こ》む前《まえ》に、毛布《もうふ》や居場所《いばしょ》を確保《かくほ》しに行《い》く", "s": 1}, {"t": "戸締《とじ》まりが気《き》になるので、一度《いちど》自宅《じたく》に戻《もど》る", "s": 0}], "scene": {"type": "shelter", "rain": 4, "depth": 0, "alert": "l4", "extra": []}, "sit": "祖母《そぼ》と早《はや》めに避難所《ひなんじょ》に到着《とうちゃく》。夜《よる》9時《じ》、<b>警戒《けいかい》レベル4（避難指示《ひなんしじ》）</b>が発令《はつれい》され、避難所《ひなんじょ》に人《ひと》が次々《つぎつぎ》と集《あつ》まってきました。", "q": "避難所《ひなんじょ》で最初《さいしょ》にすべきことは？", "tip": "受付《うけつけ》で要配慮者《ようはいりょしゃ》の情報《じょうほう》を伝《つた》えると、適切《てきせつ》な場所《ばしょ》や支援《しえん》につながります。避難後《ひなんご》に自宅《じたく》へ戻《もど》る途中《とちゅう》で被災《ひさい》する事例《じれい》があります。"}, "3m": {"c": [{"t": "水《みず》が浅《あさ》く流《なが》れもないうちに、家族《かぞく》で歩《ある》いて近《ちか》くの避難所《ひなんじょ》へ向《む》かう", "s": 2}, {"t": "外《そと》は危《あぶ》ないので、家族《かぞく》全員《ぜんいん》で自宅《じたく》の2階《かい》に上《あ》がって様子《ようす》を見《み》る", "s": 1}, {"t": "祖母《そぼ》を歩《ある》かせるのは大変《たいへん》なので、車《くるま》に乗《の》せて避難所《ひなんじょ》へ向《む》かう", "s": 0}], "scene": {"type": "house", "rain": 4, "depth": 15, "alert": "l4", "extra": []}, "sit": "自宅《じたく》で待機中《たいきちゅう》に<b>警戒《けいかい》レベル4（避難指示《ひなんしじ》）</b>が発令《はつれい》。家《いえ》の前《まえ》の道路《どうろ》は<b>水深《すいしん》 約《やく》15cm</b>。自宅《じたく》付近《ふきん》は<b>最大《さいだい》2〜3mの浸水想定《しんすいそうてい》</b>です。", "q": "どうする？", "tip": "想定浸水《そうていしんすい》が深《ふか》い場所《ばしょ》では、2階《かい》でも浸《つ》かるおそれがあります。水《みず》が浅《あさ》く流《なが》れのないうちに移動《いどう》を。車《くるま》は水深《すいしん》30cm程度《ていど》でも動《うご》けなくなることがあります。"}, "3b": {"c": [{"t": "屋外《おくがい》への避難《ひなん》は危険《きけん》と判断《はんだん》し、全員《ぜんいん》で2階《かい》以上《いじょう》へ上《あ》がり、119番《ばん》や親戚《しんせき》に状況《じょうきょう》を伝《つた》える", "s": 2}, {"t": "1階《かい》で貴重品《きちょうひん》や常備薬《じょうびやく》をまとめてから、2階《かい》へ上《あ》がる", "s": 1}, {"t": "祖母《そぼ》を車《くるま》に乗《の》せて、避難所《ひなんじょ》へ向《む》かう", "s": 0}], "scene": {"type": "house", "rain": 4, "depth": 30, "alert": "l4", "extra": []}, "sit": "様子《ようす》を見《み》ているうちに<b>警戒《けいかい》レベル4</b>が発令《はつれい》。家《いえ》の前《まえ》は<b>水深《すいしん》約《やく》30cm</b>で、流《なが》れが出始《ではじ》めています。", "q": "どうする？", "tip": "流《なが》れのある水中《すいちゅう》の移動《いどう》は、車《くるま》でも徒歩《とほ》でも極《きわ》めて危険《きけん》。屋外避難《おくがいひなん》が難《むずか》しくなったら、少《すこ》しでも高《たか》い場所《ばしょ》へ移《うつ》り（緊急安全確保《きんきゅうあんぜんかくほ》）、救助《きゅうじょ》を求《もと》めましょう。"}, "4g": {"c": [{"t": "自治体《じちたい》や気象庁《きしょうちょう》など公式情報《こうしきじょうほう》で事実《じじつ》を確認《かくにん》し、171で父《ちち》に安否《あんぴ》を伝《つた》える", "s": 2}, {"t": "SNSの情報《じょうほう》を、家族《かぞく》のグループチャットにすぐ共有《きょうゆう》する", "s": 1}, {"t": "堤防《ていぼう》の様子《ようす》を自分《じぶん》の目《め》で確《たし》かめに行《い》く", "s": 0}], "scene": {"type": "room", "rain": 4, "depth": 0, "alert": "l4", "extra": ["phone"]}, "sit": "安全《あんぜん》な場所《ばしょ》で夜《よる》を迎《むか》えました。単身赴任中《たんしんふにんちゅう》の父《ちち》と電話《でんわ》がつながらず、SNSでは真偽不明《しんぎふめい》の「堤防《ていぼう》決壊《けっかい》」情報《じょうほう》が広《ひろ》がっています。", "q": "どうする？", "tip": "災害時《さいがいじ》はデマが拡散《かくさん》しがち。公式情報《こうしきじょうほう》で確認《かくにん》しましょう。電話《でんわ》が不通《ふつう》でも、災害用《さいがいよう》伝言《でんごん》ダイヤル（171）や伝言板《でんごんばん》で安否《あんぴ》を伝《つた》えられます。"}, "4m": {"c": [{"t": "懐中電灯《かいちゅうでんとう》で明《あ》かりを確保《かくほ》し、祖母《そぼ》に寄《よ》り添《そ》いながら公式情報《こうしきじょうほう》を確認《かくにん》して次《つぎ》の行動《こうどう》に備《そな》える", "s": 2}, {"t": "電池《でんち》がもったいないので、暗《くら》いまま朝《あさ》を待《ま》つ", "s": 1}, {"t": "水位《すいい》を確《たし》かめるため、外《そと》へ様子《ようす》を見《み》に出《で》る", "s": 0}], "scene": {"type": "room", "rain": 4, "depth": 40, "alert": "l4", "extra": ["dark"]}, "sit": "夜《よる》が更《ふ》け、雨《あめ》は激《はげ》しさを増《ふ》しています。停電《ていでん》し、外《そと》の水位《すいい》は<b>約《やく》40cm</b>に。祖母《そぼ》は不安《ふあん》で落《お》ち着《つ》きません。", "q": "どうする？", "tip": "停電時《ていでんじ》は明《あ》かりと情報《じょうほう》の確保《かくほ》が第《だい》一《いち》。夜間《やかん》に外《そと》へ出《で》るのは極《きわ》めて危険《きけん》です。"}, "4b": {"c": [{"t": "近《ちか》くの頑丈《がんじょう》な建物《たてもの》の上《うえ》の階《かい》へすぐ逃《に》げ込《こ》み、119番《ばん》に居場所《いばしょ》と人数《にんずう》を伝《つた》える", "s": 2}, {"t": "その場《ば》にとどまり、水《みず》が引《ひ》くのを待《ま》つ", "s": 1}, {"t": "流《なが》れに逆《さか》らって、目的地《もくてきち》まで進《すす》み続《つづ》ける", "s": 0}], "scene": {"type": "house", "rain": 4, "depth": 50, "alert": "l5", "extra": []}, "sit": "移動中《いどうちゅう》、道路《どうろ》の水《みず》が急《きゅう》に深《ふか》くなり<b>水深《すいしん》約《やく》50cm</b>に。流《なが》れも強《つよ》く、<b>警戒《けいかい》レベル5（緊急安全確保《きんきゅうあんぜんかくほ》）</b>が発令《はつれい》されました。", "q": "どうする？", "tip": "レベル5は命《いのち》の危険《きけん》が迫《せま》る状況《じょうきょう》。流《なが》れのある水《みず》の中《なか》を進《すす》まず、最寄《もよ》りの頑丈《がんじょう》な建物《たてもの》の上《うえ》の階《かい》へ（緊急安全確保《きんきゅうあんぜんかくほ》）。"}, "5g": {"c": [{"t": "ブレーカーを落《お》としたまま、片付《かたづ》ける前《まえ》に家《いえ》の内外《ないがい》の被害《ひがい》を写真《しゃしん》で記録《きろく》する", "s": 2}, {"t": "ブレーカーを落《お》としてから、衛生《えいせい》のためにすぐ泥《どろ》を掃《は》き出《だ》して消毒《しょうどく》する", "s": 1}, {"t": "暗《くら》くて作業《さぎょう》できないので、ブレーカーを上《あ》げて電気《でんき》がつくか確認《かくにん》する", "s": 0}], 位《すいい》が平常《へいじょう》に戻《もど》っても数日《すうじつ》は遊泳《ゆうえい》を控《ひか》える", "s": 2}, {"t": "水位《すいい》が平常《へいじょう》に戻《もど》り、放流終了《ほうりゅうしゅうりょう》の発表《はっぴょう》を確認《かくにん》できたら、当日《とうじつ》でも浅瀬《あさせ》で遊《あそ》ぶ程度《ていど》にする", "s": 1}, {"t": "水《みず》が澄《す》んで水位《すいい》も下《さ》がったので、河原《かわら》に残《のこ》した荷物《にもつ》だけ急《いそ》いで回収《かいしゅう》しに行《い》く", "s": 0}], "scene": {"type": "river", "rain": 1, "depth": 30, "alert": "stop", "extra": []}, "sit": "救助隊《きゅうじょたい》によって全員《ぜんいん》が救出《きゅうしゅつ》されました。雨《あめ》は弱《よわ》まり、川《かわ》の水位《すいい》も下《さ》がり始《はじ》めています。", "q": "どうする？", "tip": "上流《じょうりゅう》の雨《あめ》がやんでも、しばらくは増水《ぞうすい》や濁流《だくりゅう》が続《つづ》き、ダム放流《ほうりゅう》が続《つづ》く場合《ばあい》もあります。浅瀬《あさせ》で遊《あそ》ぶ程度《ていど》でも当日《とうじつ》は厳禁《げんきん》。河原《かわら》への立《た》ち入《はい》りも控《ひか》えましょう。"}, "5m": {"c": [{"t": "すぐに救急隊《きゅうきゅうたい》に伝《つた》え、保温《ほおん》を続《つづ》けながら病院《びょういん》へ運《はこ》んでもらう", "s": 2}, {"t": "毛布《もうふ》で包《つつ》んで車内《しゃない》で休《やす》ませ、震《ふる》えが止《と》まらなければ病院《びょういん》へ連《つ》れて行《い》く", "s": 1}, {"t": "眠《ねむ》そうなので、体力《たいりょく》回復《かいふく》のため暖《あたた》かい車内《しゃない》でしばらく寝《ね》かせておく", "s": 0}], "scene": {"type": "river", "rain": 1, "depth": 30, "alert": "stop", "extra": []}, "sit": "救助隊《きゅうじょたい》に救出《きゅうしゅつ》されました。一緒《いっしょ》にいた仲間《なかま》がぼんやりして、受《う》け答《こた》えがはっきりしません。", "q": "どうする？", "tip": "意識《いしき》がはっきりしない・眠《ねむ》そうにするのは、中等度《ちゅうとうど》以上《いじょう》の低体温症《ていたいおんしょう》のサイン。様子《ようす》を見《み》ている間《あいだ》に悪化《あっか》することがあります。すぐに医療機関《いりょうきかん》へ。"}, "5b": {"c": [{"t": "水《みず》を飲《の》んだ人《ひと》は念《ねん》のため救急車《きゅうきゅうしゃ》で病院《びょういん》へ行《い》き、医師《いし》の診察《しんさつ》を受《う》ける", "s": 2}, {"t": "今《いま》夜《よる》は一人《ひとり》にせず、せきや息苦《いきぐる》しさが出《で》たらすぐ病院《びょういん》へ行《い》けるよう様子《ようす》を見《み》る", "s": 1}, {"t": "飲《の》んだ水《みず》を吐《は》き出《だ》させるため、お腹《なか》を押《お》したり背中《せなか》を強《つよ》くたたいたりする", "s": 0}], "scene": {"type": "river", "rain": 1, "depth": 30, "alert": "stop", "extra": []}, "sit": "救助隊《きゅうじょたい》が到着《とうちゃく》し、全員《ぜんいん》が救出《きゅうしゅつ》されました。濁流《だくりゅう》で水《みず》を飲《の》んでしまった人《ひと》もいますが、今《いま》は普通《ふつう》に話《はな》せています。", "q": "どうする？", "tip": "溺《おぼ》れかけた後《あと》は、数時間《すうじかん》たってから呼吸《こきゅう》の状態《じょうたい》が悪化《あっか》することがあります。元気《げんき》に見《み》えても必《かなら》ず受診《じゅしん》を。お腹《なか》を押《お》す・逆《さか》さにするなどの「水《みず》を吐《は》かせる」行為《こうい》は、かえって危険《きけん》です。"}}}, {"id": "mountain", "icon": "⛰️", "title": "山《やま》を登《のぼ》っているとき", "desc": "梅雨《つゆ》の時期《じき》、沢沿《さわぞ》いのルートで登山中《とざんちゅう》", "nodes": {"1": {"c": [{"t": "登山《とざん》を中止《ちゅうし》して、来《き》た道《みち》を引《ひ》き返《かえ》す。沢《さわ》を渡《わた》る場所《ばしょ》の増水《ぞうすい》も想定《そうてい》し、早《はや》めに下《くだ》る", "s": 2}, {"t": "引《ひ》き返《かえ》すより、沢《さわ》を渡《わた》らない反対側《はんたいがわ》の尾根《おね》ルートで下山《げざん》したほうが安全《あんぜん》と判断《はんだん》し、ペースを上《あ》げて山頂《さんちょう》へ向《む》かう", "s": 1}, {"t": "雨《あめ》はまだ小雨《こさめ》。土砂災害警戒情報《どしゃさいがいけいかいじょうほう》が実際《じっさい》に発表《はっぴょう》されたら引《ひ》き返《かえ》すと決《き》めて、山頂《さんちょう》を目指《めざ》す", "s": 0}], "scene": {"type": "mountain", "rain": 1, "depth": 5, "alert": "warn", "extra": ["stream"]}, "sit": "梅雨《つゆ》の時期《じき》の登山《とざん》。朝《あさ》は小雨《こさめ》でしたが、昼前《ひるまえ》に<b>大雨警報《おおあめけいほう》</b>と「土砂災害警戒情報《どしゃさいがいけいかいじょうほう》が出《で》る可能性《かのうせい》」の通知《つうち》が届《とど》きました。山頂《さんちょう》まではあと2時間《じかん》です。", "q": "どうする？", "tip": "山《やま》での撤退判断《てったいはんだん》は早《はや》いほど安全《あんぜん》です。「反対側《はんたいがわ》の尾根《おね》なら安全《あんぜん》」「情報《じょうほう》が出《で》たら引《ひ》き返《かえ》す」という判断《はんだん》は、ルートの状況《じょうきょう》が分《ぶん》からないまま先《さき》へ進《すす》むことになり、帰《かえ》り道《みち》を失《うしな》うおそれがあります。"}, "2g": {"c": [{"t": "渡《わた》らずに沢《さわ》から離《はな》れた尾根《おね》など安全《あんぜん》な場所《ばしょ》へ移動《いどう》し、水《みず》が引《ひ》くのを待《ま》つ。救助要請《きゅうじょようせい》も検討《けんとう》する", "s": 2}, {"t": "3人《ひと》で肩《かた》を組《く》むスクラム渡渉《としょう》で、流《なが》れの緩《ゆる》い広《ひろ》い瀬《せ》を選《えら》んで渡《わた》る", "s": 1}, {"t": "待《ま》つ間《あいだ》に増水《ぞうすい》が進《すす》むかもしれないので、今《いま》のうちにストックで支《ささ》えながら一人《ひとり》ずつ急《いそ》いで渡《わた》る", "s": 0}], "scene": {"type": "mountain", "rain": 3, "depth": 20, "alert": "l3", "extra": ["stream"]}, "sit": "引《ひ》き返《かえ》す途中《とちゅう》、来《く》るときに渡《わた》った沢《さわ》が増水《ぞうすい》。水《みず》は濁《にご》り、ひざ下《した》ほどの深《ふか》さで流《なが》れも速《はや》くなっています。<b>警戒《けいかい》レベル3</b>が発令《はつれい》されました。", "q": "どうする？", "tip": "増水《ぞうすい》した沢《さわ》を渡《わた》るのは、技術《ぎじゅつ》があってもひざ下《した》で足《あし》をすくわれる危険大《きけんだい》。水《みず》は数時間《すうじかん》で引《ひ》くことが多《おお》く、待《ま》つ勇気《ゆうき》が命《いのち》を守《まも》ります。"}, "2m": {"c": [{"t": "すぐにその斜面《しゃめん》から離《はな》れ、崩《くず》れそうな斜面《しゃめん》と沢《さわ》から距離《きょり》を取《と》れる尾根《おね》の方向《ほうこう》へ移動《いどう》する", "s": 2}, {"t": "斜面《しゃめん》を見《み》上《あ》げて石《いし》の動《うご》きを確認《かくにん》しながら、一人《ひとり》ずつ間隔《かんかく》をあけて素早《すばや》く通過《つうか》する", "s": 1}, {"t": "崩《くず》れるとしたら斜面《しゃめん》の上《うえ》から。少《すこ》し下《した》の沢沿《さわぞ》いの平《たい》らな場所《ばしょ》まで下《お》りて休《やす》む", "s": 0}], "scene": {"type": "mountain", "rain": 3, "depth": 0, "alert": "l3", "extra": ["rockfall"]}, "sit": "山頂《さんちょう》を越《こ》えて下《くだ》り始《はじ》めると<b>警戒《けいかい》レベル3</b>が発令《はつれい》。登山道《とざんどう》に小石《こいし》がパラパラと落《お》ち、斜面《しゃめん》から濁《にご》った水《みず》が噴《ふ》き出《だ》しています。", "q": "どうする？", "tip": "小石《こいし》の落下《らっか》や斜面《しゃめん》からの湧《わ》き水《みず》は、土砂《どしゃ》崩《くず》れの前兆《ぜんちょう》です。「一人《ひとり》ずつ素早《すばや》く通過《つうか》」も、崩《くず》れたら巻《ま》き込《こ》まれます。沢沿《さわぞ》いの低《ひく》い場所《ばしょ》は土砂《どしゃ》や水《みず》が集《あつ》まる場所《ばしょ》。尾根《おね》の方向《ほうこう》へ離《はな》れましょう。"}, "2b": {"c": [{"t": "無理《むり》に動《うご》かず、安全《あんぜん》な場所《ばしょ》でツェルト等《とう》を使《つか》って風雨《ふうう》をしのぎ、電波《でんぱ》の入《はい》る場所《ばしょ》で救助《きゅうじょ》を要請《ようせい》する", "s": 2}, {"t": "暗《くら》くなる前《まえ》の下山《げざん》を優先《ゆうせん》し、けがをした仲間《なかま》の荷物《にもつ》を分担《ぶんたん》して、来《き》た道《みち》をゆっくり下《お》りる", "s": 1}, {"t": "視界《しかい》が悪《わる》いときは、迷《まよ》いにくい沢沿《さわぞ》いのルートで下山《げざん》する", "s": 0}], "scene": {"type": "mountain", "rain": 3, "depth": 0, "alert": "l3", "extra": ["fog"]}, "sit": "山頂《さんちょう》付近《ふきん》で<b>警戒《けいかい》レベル3</b>が発令《はつれい》。雨《あめ》と霧《きり》で視界《しかい》は10m、電波《でんぱ》も入《はい》りません。仲間《なかま》の一人《ひとり》が足《あし》を滑《すべ》らせ、足首《あしくび》をひねりました。", "q": "どうする？", "tip": "視界不良《しかいふりょう》でけが人《ひと》がいる中《なか》での行動《こうどう》は遭難《そうなん》を招《まね》きます。沢沿《さわぞ》いは道《みち》が分《ぶん》かりやすくても増水《ぞうすい》の危険大《きけんだい》。緊急《きんきゅう》の露営《ろえい》（ビバーク）と早《はや》めの救助要請《きゅうじょようせい》を。"}, "3g": {"c": [{"t": "土石流《どせきりゅう》の前兆《ぜんちょう》と判断《はんだん》し、沢《さわ》からさらに離《はな》れた高《たか》い場所《ばしょ》へ直《ただ》ちに移動《いどう》する", "s": 2}, {"t": "雨《あめ》が弱《よわ》まり始《はじ》めたサインと考《かんが》え、その場《ば》で待機《たいき》を続《つづ》けながら荷物《にもつ》をまとめておく", "s": 1}, {"t": "水位《すいい》が下《さ》がった今《いま》が渡《わた》るチャンスと考《かんが》え、ロープで確保《かくほ》しながら沢《さわ》を渡《わた》って下山《げざん》する", "s": 0}], "scene": {"type": "mountain", "rain": 4, "depth": 30, "alert": "dosha", "extra": ["stream"]}, "sit": "安全《あんぜん》な場所《ばしょ》で待機中《たいきちゅう》、<b>土砂災害警戒情報《どしゃさいがいけいかいじょうほう》</b>が発表《はっぴょう》されました。近《ちか》くの沢《さわ》から「ゴロゴロ」という音《おと》がし、雨《あめ》が続《つづ》いているのに沢《さわ》の水位《すいい》が急《きゅう》に下《さ》がりました。", "q": "どうする？", "tip": "雨《あめ》が続《つづ》くのに沢《さわ》の水位《すいい》が急《きゅう》に下《さ》がるのは、上流《じょうりゅう》で土砂《どしゃ》が水《みず》をせき止《と》めている可能性《かのうせい》。土石流《どせきりゅう》の直前《ちょくぜん》の危険《きけん》なサインです。「雨《あめ》が弱《よわ》まった」「渡《わた》るチャンス」と誤解《ごかい》しないこと。"}, "3m": {"c": [{"t": "崩《くず》れた場所《ばしょ》は通《とお》らず、安全《あんぜん》な場所《ばしょ》で待機《たいき》して救助《きゅうじょ》を要請《ようせい》する", "s": 2}, {"t": "雨《あめ》を含《ふく》んで締《し》まった土砂《どしゃ》の上《うえ》を、ストックで足場《あしば》を確《たし》かめながら一人《ひとり》ずつ慎重《しんちょう》に渡《わた》る", "s": 1}, {"t": "崩《くず》れた場所《ばしょ》を避《さ》けるため、地図《ちず》アプリで確認《かくにん》しながら谷側《たにがわ》へ回《まわ》り込《こ》んで下山《げざん》する", "s": 0}], "scene": {"type": "mountain", "rain": 4, "depth": 0, "alert": "dosha", "extra": ["rockfall"]}, "sit": "下山《げざん》を続《つづ》けていると<b>土砂災害警戒情報《どしゃさいがいけいかいじょうほう》</b>が発表《はっぴょう》されました。ルートの先《さき》は、土砂《どしゃ》崩《くず》れで登山道《とざんどう》が埋《う》まっています。", "q": "どうする？", "tip": "一度《いちど》崩《くず》れた斜面《しゃめん》は再《ふたた》び崩《くず》れやすく、雨《あめ》を含《ふく》んだ土砂《どしゃ》の上《うえ》は足場《あしば》も不安定《ふあんてい》です。谷側《たにがわ》へ回《まわ》り込《こ》むのは土石流《どせきりゅう》の通《とお》り道《みち》に入《はい》ることになります。"}, "3b": {"c": [{"t": "沢《さわ》から離《はな》れる方向《ほうこう》へ斜面《しゃめん》を登《のぼ》り、高《たか》い場所《ばしょ》で救助《きゅうじょ》を待《ま》つ", "s": 2}, {"t": "水面《すいめん》より2〜3m高《たか》い登山道《とざんどう》の山《やま》側《がわ》の端《はし》なら安全《あんぜん》と判断《はんだん》し、慎重《しんちょう》に下《くだ》り続《つづ》ける", "s": 1}, {"t": "濁流《だくりゅう》の音《おと》で周《まわ》りの音《おと》が聞《き》こえないので、大《おお》きな岩《いわ》の陰《かげ》で待機《たいき》して情報《じょうほう》を待《ま》つ", "s": 0}], "scene": {"type": "mountain", "rain": 4, "depth": 30, "alert": "dosha", "extra": ["stream"]}, "sit": "沢沿《さわぞ》いにいると<b>土砂災害警戒情報《どしゃさいがいけいかいじょうほう》</b>が発表《はっぴょう》。沢《さわ》の水《みず》があふれ、登山道《とざんどう》が川《かわ》のようになっています。", "q": "どうする？", "tip": "沢沿《さわぞ》いは鉄砲水《てっぽうみず》や土石流《どせきりゅう》の通《とお》り道《みち》です。水面《すいめん》より少《すこ》し高《たか》い程度《ていど》では安全《あんぜん》とはいえません。標高《ひょうこう》を上《あ》げ、沢《さわ》から離《はな》れることが鉄則《てっそく》です。"}, "4g": {"c": [{"t": "電波《でんぱ》が入《はい》るうちに110番《ばん》か119番《ばん》で、現在地《げんざいち》（緯度《いど》・経度《けいど》）と人数《にんずう》・装備《そうび》を伝《つた》え、その後《ご》は電源《でんげん》を切《き》って節電《せつでん》する", "s": 2}, {"t": "まず家族《かぞく》に状況《じょうきょう》を伝《つた》え、家族《かぞく》から警察《けいさつ》へ通報《つうほう》してもらう", "s": 1}, {"t": "電池《でんち》を節約《せつやく》するため電源《でんげん》を切《き》り、明《あか》るくなって電波《でんぱ》が安定《あんてい》してから救助《きゅうじょ》を要請《ようせい》する", "s": 0}], "scene": {"type": "mountain", "rain": 4, "depth": 0, "alert": "dosha", "extra": ["phone"]}, "sit": "高《たか》い場所《ばしょ》で夜《よる》を迎《むか》えました。スマホの電池《でんち》は残《のこ》り20%。ときどき電波《でんぱ》が入《はい》ります。", "q": "どうする？", "tip": "山岳遭難《さんがくそうなん》は110番《ばん》・119番《ばん》へ直接《ちょくせつ》。家族《かぞく》を経由《けいゆ》すると情報《じょうほう》が不正確《ふせいかく》になり、時間《じかん》もかかります。電波《でんぱ》は「入《はい》るときに使《つか》う」が原則《げんそく》。位置情報《いちじょうほう》を正確《せいかく》に伝《つた》え、その後《あと》は節電《せつでん》を。"}, "4m": {"c": [{"t": "ツェルトや雨具《あまぐ》で風雨《ふうう》を防《ふせ》ぎ、乾《かわ》いた服《ふく》に着替《きが》え、仲間《なかま》と体《からだ》を 4", "extra": ["night"]}, "sit": "中州《なかす》の一番《いちばん》高《たか》い場所《ばしょ》で取《と》り残《のこ》されています。<b>警戒《けいかい》レベル4</b>が発令《はつれい》され、水《みず》は足元《あしもと》まで迫《せま》ってきました。", "q": "どうする？", "tip": "救助《きゅうじょ》を待《ま》つ間《あいだ》も、通報《つうほう》・浮力《ふりょく》の確保《かくほ》・居場所《いばしょ》の合図《あいず》が大切《たいせつ》です。テントは流《なが》されやすく、中《なか》にいると外《そと》の状況《じょうきょう》が分《ぶん》かりません。濁流《だくりゅう》を先《さき》に渡《わた》るのは極《きわ》めて危険《きけん》です。"}, "4g": {"c": [{"t": "隊員《たいいん》の指示《しじ》があるまで身《み》を低《ひく》くし、指示《しじ》に従《したが》って一人《ひとり》ずつ行動《こうどう》する", "s": 2}, {"t": "救助《きゅうじょ》を早《はや》めるため、全員《ぜんいん》の荷物《にもつ》をまとめ、ライトを持《も》って水際《みずぎわ》近《ちか》くに集《あつ》まっておく", "s": 1}, {"t": "隊員《たいいん》の手《て》を煩《わずら》わせないよう、垂《た》れているロープに自分《じぶん》でつかまって先《さき》に上《あ》がる", "s": 0}], "scene": {"type": "camp", "rain": 4, "depth": 40, "alert": "l5", "extra": ["night"]}, "sit": "<b>警戒《けいかい》レベル5（緊急安全確保《きんきゅうあんぜんかくほ》）</b>が発令《はつれい》。救助隊《きゅうじょたい》が到着《とうちゃく》し、照明《しょうめい》で周囲《しゅうい》を照《て》らしながら救助《きゅうじょ》と避難誘導《ひなんゆうどう》を始《はじ》めました。強《つよ》い風《かぜ》が吹《ふ》きつけています。", "q": "どうする？", "tip": "救助《きゅうじょ》の現場《げんば》では隊員《たいいん》の指示《しじ》がすべて。準備《じゅんび》のつもりで水際《みずぎわ》に集《あつ》まったり、ロープに自分《じぶん》でつかまったりするのは事故《じこ》のもとです。"}, "4m": {"c": [{"t": "すぐに水際《みずぎわ》から離《はな》れ、少《すこ》しでも高《たか》い場所《ばしょ》へ移動《いどう》して、ライトで居場所《いばしょ》を知《し》らせる", "s": 2}, {"t": "荷物《にもつ》が流《なが》される前《まえ》に手《て》元《もと》にまとめてから、高《たか》い場所《ばしょ》へ移動《いどう》する", "s": 1}, {"t": "暗闇《くらやみ》で動《うご》くと転倒《てんとう》するので、その場《ば》で姿勢《しせい》を低《ひく》くして水《みず》が引《ひ》くのを待《ま》つ", "s": 0}], "scene": {"type": "camp", "rain": 4, "depth": 40, "alert": "l5", "extra": ["night", "empty"]}, "sit": "水位《すいい》はさらに上《あ》がり、足元《あしもと》まで濁流《だくりゅう》が迫《せま》ってきました。<b>警戒《けいかい》レベル5</b>が発令《はつれい》されています。", "q": "どうする？", "tip": "水際《みずぎわ》は一瞬《いっしゅん》で流《なが》されます。荷物《にもつ》をまとめる数秒《すうびょう》も命取《いのちと》り。その場《ば》で待《ま》つのも危険《きけん》です。少《すこ》しでも高《たか》い場所《ばしょ》へ移《うつ》り、居場所《いばしょ》を知《し》らせましょう。"}, "4b": {"c": [{"t": "あお向《む》けに浮《う》いて足《あし》を下流《かりゅう》に向《む》け、呼吸《こきゅう》を確保《かくほ》しながら、声《こえ》やライトで居場所《いばしょ》を知《し》らせる", "s": 2}, {"t": "近《ちか》くを流《なが》れる木《き》やクーラーボックスにつかまり、浮力《ふりょく》を確保《かくほ》して流《なが》れに乗《の》る", "s": 1}, {"t": "体力《たいりょく》があるうちに、岸《きし》の明《あ》かりを目指《めざ》して全力《ぜんりょく》で泳《およ》ぐ", "s": 0}], "scene": {"type": "camp", "rain": 4, "depth": 60, "alert": "l5", "extra": ["night"]}, "sit": "濁流 ual", "s": 1}, {"t": "Go look at the swollen river", "s": 0}], "sit": "The rain stopped, and you were able to meet your family.", "q": "What should you be careful about when walking outside from now on?", "tip": "Even after the rain stops, rivers stay high for a while. Don't go near them!", "scene": {"type": "house", "rain": 0, "depth": 5, "alert": "stop", "extra": []}}, "5m": {"c": [{"t": "Check in and tell your family where you are", "s": 2}, {"t": "Rest while you're still wet", "s": 1}, {"t": "Go back home to check on it", "s": 0}], "sit": "You finally made it to the shelter.", "q": "What do you do first?", "tip": "Checking in helps your family find you.", "scene": {"type": "shelter", "rain": 1, "depth": 0, "alert": "l4", "extra": []}}, "5b": {"c": [{"t": "Hold hands with your family and avoid water and mud on the way home", "s": 2}, {"t": "Run home quickly", "s": 1}, {"t": "Play in the puddles on the way home", "s": 0}], "sit": "In the morning the rain stopped, and your family came to pick you up.", "q": "What do you do?", "tip": "Holes can hide under mud. Walk together with an adult.", "scene": {"type": "house", "rain": 0, "depth": 10, "alert": "stop", "extra": []}}}}], "hard": [{"id": "home", "icon": "🏠", "title": "At home", "desc": "Spending time with family in a 2-story house", "nodes": {"1": {"c": [{"t": "Check the hazard map for your home's flood risk and evacuation site, and decide as a family at what stage you will evacuate", "s": 2}, {"t": "Charge flashlights and phones in case of a blackout, and put an emergency go-bag by the front door", "s": 1}, {"t": "Go outside and clear the gutters and drainpipes in front of the house before the rain gets worse", "s": 0}], "sit": "In the evening, the rain intensifies and a <b>Heavy Rain Warning</b> is issued for Koganei City. It is forecast to get even stronger into the night.", "q": "What do you do first?", "tip": "Preparation matters, but the top priority is deciding \"when and where to evacuate.\" People have been hurt going outside in heavy rain to check gutters and waterways.", "scene": {"type": "house", "rain": 2, "depth": 0, "alert": "warn", "extra": ["hazard"]}}, "2g": {"c": [{"t": "Take your grandmother and start moving to a relative's house or a shelter while you still can", "s": 2}, {"t": "Move your grandmother to the 2nd-floor bedroom and have the family ready to leave once an evacuation order is issued", "s": 1}, {"t": "Moving at night is dangerous, so the whole family waits in the 1st-floor living room until an evacuation order is issued", "s": 0}], "sit": "You've confirmed your area could flood <b>up to 2–3 m</b>. At 7 p.m., <b>Alert Level 3 (Elderly etc. Evacuate)</b> is issued. Your grandmother, who has trouble walking, is at home.", "q": "What do you do?", "tip": "Level 3 means people who need more time, such as the elderly, should start evacuating. Waiting for Level 4 means moving in even darker, heavier rain.", "scene": {"type": "house", "rain": 3, "depth": 0, "alert": "l3", "extra": ["grandma"]}}, "2m": {"c": [{"t": "Check the hazard map for an evacuation site and route, and start moving with your grandmother right away", "s": 2}, {"t": "Confirm the shelter location as a family and plan to leave once an evacuation order is issued", "s": 1}, {"t": "Shelters get crowded, so decide to wait and see at home", "s": 0}], "sit": "While you're packing the go-bag, <b>Alert Level 3 (Elderly etc. Evacuate)</b> is issued at 7 p.m. You haven't decided where to evacuate. Your grandmother has trouble walking.", "q": "What do you do?", "tip": "Even with supplies ready, you can't act without a destination. Level 3 is when the elderly start evacuating. Once you decide, move immediately.", "scene": {"type": "house", "rain": 3, "depth": 0, "alert": "l3", "extra": ["grandma"]}}, "2b": {"c": [{"t": "Tell your family about the injury, ask relatives or neighbors for help early, and start moving with your grandmother", "s": 2}, {"t": "Treat the injury first, then calmly think abo  do you do?", "tip": "In a blackout, securing light and information comes first. Going outside at night is extremely dangerous.", "scene": {"type": "room", "rain": 4, "depth": 40, "alert": "l4", "extra": ["dark"]}}, "4b": {"c": [{"t": "Get to an upper floor of a nearby sturdy building right away, and tell 119 your location and headcount", "s": 2}, {"t": "Stay where you are and wait for the water to go down", "s": 1}, {"t": "Keep pushing against the current toward your destination", "s": 0}], "sit": "While you're on the move, the water on the road suddenly deepens to <b>about 50 cm</b>. The current is strong, and <b>Alert Level 5 (Emergency Safety Measure)</b> is issued.", "q": "What do you do?", "tip": "Level 5 means lives are in immediate danger. Don't push through flowing water — get to an upper floor of the nearest sturdy building (Emergency Safety Measure).", "scene": {"type": "house", "rain": 4, "depth": 50, "alert": "l5", "extra": []}}, "5g": {"c": [{"t": "Leave the breaker off and photograph the damage inside and outside before cleaning", "s": 2}, {"t": "Turn off the breaker, then sweep out the mud and disinfect right away for hygiene", "s": 1}, {"t": "It's too dark to work, so flip the breaker back on to see if the lights work", "s": 0}], "sit": "The rain stopped. You return home to find the 1st floor covered in mud, and the power is off.", "q": "What do you do before cleaning up?", "tip": "Powering flooded electrical equipment risks electric shock and fire. Photographing damage before cleaning helps with disaster certificates and insurance claims.", "scene": {"type": "house", "rain": 0, "depth": 5, "alert": "stop", "extra": ["breaker"]}}, "5m": {"c": [{"t": "Follow the rescue team's instructions and have your grandmother board first", "s": 2}, {"t": "Quickly gather medications and other essentials before boarding", "s": 1}, {"t": "You can't wait, so swim to the boat when it gets close", "s": 0}], "sit": "Even at dawn, the whole area is still flooded. A resc  by a safe route", "s": 2}, {"t": "Rush home and treat the wound once you get there", "s": 1}, {"t": "Walk home in sandals on muddy roads", "s": 0}], "sit": "Dawn breaks and the water starts to recede. Your clothes are soaked and you have a cut on your leg.", "q": "What do you do?", "tip": "Floodwater is full of germs, and wounds can get infected. Treat them early.", "scene": {"type": "office", "rain": 0, "depth": 15, "alert": "stop", "extra": []}}}}, {"id": "mall", "icon": "🛍️", "title": "At a shopping mall", "desc": "Shopping at a large mall", "nodes": {"1": {"c": [{"t": "Check the flood risk on your route home and the mall's evacuation guidance", "s": 2}, {"t": "Stop shopping and drive home right away from the underground garage", "s": 1}, {"t": "It's sale time, so ignore the warning and keep shopping", "s": 0}], "sit": "While you're shopping at a large mall on your day off, an announcement says a <b>Heavy Rain Warning</b> has been issued. Your car is in the underground parking garage.", "q": "What do you do?", "tip": "Gather information at the warning stage and keep your options open.", "scene": {"type": "mall", "rain": 2, "depth": 0, "alert": "warn", "extra": []}}, "2g": {"c": [{"t": "Hold off on going home, and wait on an upper floor as the mall directs", "s": 2}, {"t": "Drive home by a longer route that avoids the underpass", "s": 1}, {"t": "Go down to the underground garage to move your car to higher ground", "s": 0}], "sit": "<b>Alert Level 3</b> is issued. Your route home has a flood-prone underpass. The mall announces you can take temporary refuge on its upper floors.", "q": "What do you do?", "tip": "To avoid getting caught while traveling, staying in a safe place is also an important choice. Heading to the underground garage is dangerous.", "scene": {"type": "mall", "rain": 3, "depth": 0, "alert": "l3", "extra": []}}, "2m": {"c": [{"t": "Give up on the car, leave the garage, and go to an upper floor", "s": 2}, {"t": "Hurry into the car and drive out to
