ed. The surrounding roads are flooded, <b>about 20 cm deep</b>.", "q": "What do you do?", "tip": "Avoid driving on flooded roads. Make use of nearby high places and sturdy buildings. Never flee underground.", "scene": {"type": "car", "rain": 4, "depth": 20, "alert": "l4", "extra": []}}, "3b": {"c": [{"t": "Leave the car and go up the nearest stairs to street level immediately", "s": 2}, {"t": "Get in the car and try to escape up the exit ramp", "s": 1}, {"t": "Take refuge in the car and wait for the water to go down", "s": 0}], "sit": "In the underground garage, muddy water is pouring down the ramp, and the floor is <b>about 30 cm deep</b>. <b>Alert Level 4</b> has been issued.", "q": "What do you do?", "tip": "Water collects underground and can fill it within minutes. Leave the car and take the stairs up right away.", "scene": {"type": "underground", "rain": 4, "depth": 30, "alert": "l4", "extra": ["car"]}}, "4g": {"c": [{"t": "Follow staff guidance, take the stairs up, and watch out for children and older people", "s": 2}, {"t": "Join the flow of people climbing the stopped escalator", "s": 1}, {"t": "Join the crowd rushing to the exits and try to get outside", "s": 0}], "sit": "The mall's 1st floor is flooding and the power is out. Many shoppers are still inside, and people are getting agitated.", "q": "What do you do?", "tip": "Crowds during a blackout risk panic and crushes. Follow guidance and stay calm.", "scene": {"type": "mall", "rain": 4, "depth": 40, "alert": "l4", "extra": []}}, "4m": {"c": [{"t": "Turn down the pickup, say you'll stay here, and ask your family to stay somewhere safe too", "s": 2}, {"t": "Ask them to pick you up once the water goes down", "s": 1}, {"t": "Ask them to come get you by car right away", "s": 0}], "sit": "The flooding deepens to <b>about 40 cm</b>. You managed to escape to an upper floor of a nearby building. Outside, cars are starting to float. Your family texts, \"Should we come get you?\"", "q": "What do you do?", "tip": "Family coming to pick you up may get caught in the flood. Both of you should stay in safe places.", "scene": {"type": "office", "rain": 4, "depth": 40, "alert": "l4", "extra": []}}, "4b": {"c": [{"t": "Look for other stairs or exits, move along the wall to the highest spot you can, and shout for help", "s": 2}, {"t": "Keep throwing your body against the door to force it open", "s": 1}, {"t": "Dive under and try to escape through the flooded ramp", "s": 0}], "sit": "You abandon the car underground and head for the stairs, but the water is waist-high. The current is fast, and the exit door won't open because of the water pressure.", "q": "What do you do?", "tip": "Underground doors become hard to open even in tens of centimeters of water. Find another exit and wait for rescue in a higher spot.", "scene": {"type": "underground", "rain": 4, "depth": 50, "alert": "l4", "extra": ["car"]}}, "5g": {"c": [{"t": "Check information on flooded and closed roads, then go home by a safe route", "s": 2}, {"t": "You want to get home fast, so take your usual route", "s": 1}, {"t": "Take a shortcut through an underpass that still has water", "s": 0}], "sit": "The rain stops, and it's now safe enough to head home.", "q": "What do you do?", "tip": "Even after the rain stops, flooding and road collapses may remain.", "scene": {"type": "mall", "rain": 0, "depth": 5, "alert": "stop", "extra": []}}, "5m": {"c": [{"t": "Don't start the engine; contact your insurer or roadside assistance, and photograph the damage", "s": 2}, {"t": "Wait a few days for the car to dry, then start the engine", "s": 1}, {"t": "Start the engine right away to drive home", "s": 0}], "sit": "The rain stopped, but your car was flooded.", "q": "What do you do?", "tip": "Flooded cars risk electric shock and fires. Don't start the engine; consult professionals.", "scene": {"type": "mall", "rain": 0, "depth": 10, "alert": "stop", "extra": []}}, "5b": {"c": [{"t": "Get the wound treated at the first-aid station and warm up", "s": 2}, {"t": "It's not a serious injury, so go straight home", "s": 1}, {"t": "Go back for the car and belongings you left behind", "s": 0}], "sit": "The rescue team pulled you out. You're soaked and have a cut on your leg.", "q": "What do you do?", "tip": "Watch out for infection from contaminated water and hypothermia. Never return to a dangerous place after being rescued.", "scene": {"type": "mall", "rain": 0, "depth": 20, "alert": "stop", "extra": []}}}}], "oni": [{"id": "river", "icon": "🏊", "title": "Swimming in a river", "desc": "Swimming with friends in a mountain stream in summer", "nodes": {"1": {"c": [{"t": "Stop swimming right away, get everyone out of the river, and move to high ground with your belongings", "s": 2}, {"t": "Agree to swim only in the shallows within a few meters of the bank, and assign someone to watch the sky and upstream", "s": 1}, {"t": "Check the rain radar, confirm there are no rain clouds directly overhead, and keep swimming", "s": 0}], "sit": "On a summer afternoon, you're swimming in a mountain stream. It's sunny overhead, but <b>dark clouds hang over the mountains upstream</b>, and thunder rumbles in the distance.", "q": "What do you do?", "tip": "Rain upstream can cause a sudden surge (flash flood) downstream even under clear skies. Even if the radar shows no clouds overhead, thunder and dark clouds upstream mean \"get out.\" Staying in the shallows or posting a lookout won't save you from water that rises in seconds.", "scene": {"type": "river", "rain": 0, "depth": 0, "alert": "kaminari", "extra": ["cloudup"]}}, "2g": {"c": [{"t": "Leave the riverbank too, and move well above the river, such as onto a levee or road", "s": 2}, {"t": "Everyone climbs onto a big rock on the riverbank, more than 2 m above the water, and watches the river from there", "s": 1}, {"t": "The water hasn't risen yet, so pack up your things at the water's edge and get ready to leave", "s": 0}], "sit": "Everyone moved to a high spot on the riverbank. Soon, the water suddenly turns muddy, and twigs and leaves start flowing down.", "q": "What do you do?", "tip": "Muddy water and debris are warning signs of a surge. Riverbanks, including big rocks on them, go underwater when rivers rise. \"The water hasn't risen yet\" is no reason to feel safe. Go somewhere clearly higher than the river, like a levee or road.", "scene": {"type": "river", "rain": 1, "depth": 5, "alert": "kaminari", "extra": ["cloudup"]}}, "2m": {"c": [{"t": "Get out immediately and run up to high ground, even if you leave your things behind", "s": 2}, {"t": "Get out right away, grab only the valuables and shoes lying close by, and head to high ground", "s": 1}, {"t": "Rushing can make you fall, so check the current and walk slowly and surely to the bank", "s": 0}], "sit": "As you swim near the bank, the water suddenly turns cold and muddy. The water level seems to have risen a little.", "q": "What do you do?", "tip": "Dropping water temperature, muddy water, and rising levels are signs right before a flash flood. The few seconds spent grabbing valuables, or the extra time spent walking carefully, can be fatal. Take nothing and get to high ground now.", "scene": {"type": "river", "rain": 1, "depth": 10, "alert": "kaminari", "extra": ["cloudup", "swimmer"]}}, "2b": {"c": [{"t": "Don't fight the current — swim diagonally downstream toward the nearest bank", "s": 2}, {"t": "Swim with all your strength straight across the current toward your original bank, where your friends and things are", "s": 1}, {"t": "To save energy, grab a big rock in the river to catch your breath, then head for the bank", "s": 0}], "sit": "While you're swimming, you hear a roar from upstream. The water rises before your eyes, and the current gets stronger.", "q": "What do you do?", "tip": "Swimming against the current wears you out. Aim for the nearest bank, not the one you came from, and swim diagonally with the current. Rocks in the river go under quickly and leave you stranded.", "scene": {"type": "river", "rain": 2, "depth": 25, "alert": "kaminari", "extra": ["cloudup", "swimmer"]}}, "3g": {"c": [{"t": "Stay on high ground, warn them by shouting and waving, and call 119", "s": 2}, {"t": "They may not know what the siren means, so go partway down the bank until your voice can reach them", "s": 1}, {"t": "Go down to the riverbank, help the group pack up, and all climb back up together quickly", "s": 0}], "sit": "Just after you manage to reach high ground away from the river, a <b>siren announcing a dam release</b> blares from upstream. Another group is still on the riverbank.", "q": "What do you do?", "tip": "People trying to help keep becoming victims themselves. Going partway down \"to be heard,\" or rushing down to help them pack, is dangerous too. Water can rise faster than expected after a dam release. Warn them from a safe place and call for help.", "scene": {"type": "river", "rain": 3, "depth": 25, "alert": "dam", "extra": []}}, "3m": {"c": [{"t": "Stop them firmly, and move everyone up onto the levee at once", "s": 2}, {"t": "Stop your friend, and everyone moves to the highest spot on the riverbank to watch", "s": 1}, {"t": "A phone is needed to call for help, so two of you quickly go get it and come right back", "s": 0}], "sit": "While you're on the riverbank, the <b>dam-release siren</b> sounds. A friend is about to go back for the wallet and phone left at the water's edge.", "q": "What do you do?", "tip": "People are often swept away going back for belongings when rivers rise. Even if a phone could help with a rescue, it isn't worth a life. High spots on the riverbank also go under quickly.", "scene": {"type": "river", "rain": 3, "depth": 25, "alert": "dam", "extra": []}}, "3b": {"c": [{"t": "Float on your back with your feet downstream, go with the current, and wait for a chance to reach the bank", "s": 2}, {"t": "Grab a branch hanging over from the bank and cling to it until the current calms", "s": 1}, {"t": "Face down with your head upstream, and swim the crawl against the current toward the bank", "s": 0}], "sit": "A sudden surge sweeps you off your feet, and you're being pushed downstream. You can hear the <b>dam-release siren</b>.", "q": "What do you do?", "tip": "In fast water, the basic technique is \"defensive swimming\": float on your back with your feet downstream. Overhanging branches can let water through while pinning your body (a \"strainer\"), and crawling against the current drains your strength fast.", "scene": {"type": "river", "rain": 3, "depth": 40, "alert": "dam", "extra": ["swimmer"]}}, "4g": {"c": [{"t": "Take off their wet swimsuit, wrap them in dry clothes and towels, and warm them out of the wind", "s": 2}, {"t": "Give them a sweet warm drink and rub their arms and legs well to boost circulation", "s": 1}, {"t": "To raise their temperature quickly, focus on warming their hands and feet with heat packs or hot water", "s": 0}], "sit": "Everyone has gathered safely on high ground, but the riverbank has already been swallowed by the torrent. One of your friends is shivering, and their lips are turning purple.", "q": "What do you do?", "tip": "If hypothermia is suspected, remove wet clothes and warm the core with dry things. Rubbing the arms and legs or warming them first can send cold blood back to the core and make things worse.", "scene": {"type": "river", "rain": 4, "depth": 50, "alert": "dam", "extra": []}}, "4m": {"c": [{"t": "Hold the branch tightly, call for help by shouting or with a whistle, and save your strength", "s": 2}, {"t": "Before your arms give out, inch your way along the branch toward the bank", "s": 1}, {"t": "Let go while you still have strength, drift down to the shallows, and stand up there", "s": 0}], "sit": "The riverbank is swallowed by the torrent, and you're left clinging to a tree branch near the bank. Your body is frozen, and your arms are losing strength.", "q": "What do you do?", "tip": "Once your strength runs out, escaping on your own is hard. Moving along the branch raises the risk of slipping, and letting go into the current is the most dangerous choice. Hold on tight and call for help by shouting or with a whistle.", "scene": {"type": "river", "rain": 4, "depth": 50, "alert": "dam", "extra": ["swimmer"]}}, "4b": {"c": [{"t": "Relax, float on your back with your feet downstream, and secure your breathing", "s": 2}, {"t": "Grab a log floating nearby to stay afloat", "s": 1}, {"t": "Take a deep breath, dive, and swim near the riverbed where the current is weaker toward the bank", "s": 0}], "sit": "You've been completely swallowed by the torrent. You've swallowed water, you're tumbling, and you can't tell which way is up.", "q": "What do you do?", "tip": "Thrashing in panic drains your strength and makes you sink. First float and secure your breathing, with your feet downstream to protect you from rocks. Logs can roll or get pinned on rocks.", "scene": {"type": "river", "rain": 4, "depth": 50, "alert": "dam", "extra": ["swimmer"]}}, "5g": {"c": [{"t": "Stay away from the river that day, and avoid swimming for several days even after levels return to normal", "s": 2}, {"t": "Once the level is back to normal and the end of the dam release is announced, just play in the shallows, even if it's the same day", "s": 1}, {"t": "The water is clear and has dropped, so hurry to collect only the belongings left on the riverbank", "s": 0}], "sit": "The rescue team saved everyone. The rain has eased, and the river is starting to drop.", "q": "What do you do?", "tip": "Even after upstream rain stops, rising water, torrents, and dam releases can continue for a while. Don't play even in the shallows that day, and stay off the riverbank.", "scene": {"type": "river", "rain": 1, "depth": 30, "alert": "stop", "extra": []}}, "5m": {"c": [{"t": "Tell the paramedics right away and have them take your friend to the hospital while keeping them warm", "s": 2}, {"t": "Wrap them in a blanket and let them rest in the car, and take them to the hospital if the shivering doesn't stop", "s": 1}, {"t": "They seem sleepy, so let them sleep in the warm car for a while to recover", "s": 0}], "sit": "You've been rescued. A friend who was with you seems dazed and isn't answering clearly.", "q": "What do you do?", "tip": "Confusion or drowsiness is a sign of moderate or worse hypothermia. It can get worse while you \"wait and see.\" Get medical care right away.", "scene": {"type": "river", "rain": 1, "depth": 30, "alert": "stop", "extra": []}}, "5b": {"c": [{"t": "Anyone who swallowed water goes to the hospital by ambulance to be examined, just in case", "s": 2}, {"t": "Don't leave them alone tonight, and watch so they can go to the hospital right away if they cough or have trouble breathing", "s": 1}, {"t": "Press on their stomach or pound their back hard to make them cough up the water", "s": 0}], "sit": "The rescue team arrived and everyone was saved. Some people swallowed water in the torrent, but they can talk normally now.", "q": "What do you do?", "tip": "After a near-drowning, breathing can worsen several hours later. Even if someone seems fine, always see a doctor. Pressing the stomach or turning someone upside down to \"get the water out\" is dangerous.", "scene": {"type": "river", "rain": 1, "depth": 30, "alert": "stop", "extra": []}}}}, {"id": "mountain", "icon": "⛰️", "title": "Climbing a mountain", "desc": "Hiking a streamside trail in the rainy season", "nodes": {"1": {"c": [{"t": "Cancel the hike and go back the way you came, descending early in case the stream crossings rise", "s": 2}, {"t": "Decide it's safer to descend by the ridge on the other side, which has no stream crossings, and speed up toward the summit", "s": 1}, {"t": "It's only drizzling. Decide to turn back once a Landslide Alert is actually issued, and keep heading for the summit", "s": 0}], "sit": "You're hiking in the rainy season. It was drizzling in the morning, but before noon you get alerts for a <b>Heavy Rain Warning</b> and \"a possible Landslide Alert.\" The summit is still 2 hours away.", "q": "What do you do?", "tip": "In the mountains, the earlier you retreat, the safer you are. Deciding \"the other ridge is safer\" or \"we'll turn back once the alert is issued\" means pushing ahead without knowing the route conditions, and you may lose your way back.", "scene": {"type": "mountain", "rain": 1, "depth": 5, "alert": "warn", "extra": ["stream"]}}, "2g": {"c": [{"t": "Don't cross; move to a safe spot away from the stream, such as a ridge, wait for the water to drop, and consider calling for rescue", "s": 2}, {"t": "Cross in a three-person huddle with arms linked, choosing a wide section where the current is slower", "s": 1}, {"t": "It may rise more while you wait, so cross one at a time now, quickly, using trekking poles for support", "s": 0}], "sit": "On the way back, the stream you crossed earlier has risen. The water is muddy, just below knee-deep, and flowing fast. <b>Alert Level 3</b> has been issued.", "q": "What do you do?", "tip": "Crossing a swollen stream can sweep you off your feet even below the knee, no matter your technique. Water often drops within hours — the courage to wait saves lives.", "scene": {"type": "mountain", "rain": 3, "depth": 20, "alert": "l3", "extra": ["stream"]}}, "2m": {"c": [{"t": "Leave that slope immediately and head toward a ridge away from unstable slopes and streams", "s": 2}, {"t": "Watch the slope for moving rocks and pass beneath it quickly, one at a time, with spacing between people", "s": 1}, {"t": "If it collapses, it'll come from the top. Go down a bit to a flat spot by the stream and rest", "s": 0}], "sit": "After you pass the summit and start down, <b>Alert Level 3</b> is issued. Pebbles patter down onto the trail, and muddy water spurts from the slope.", "q": "What do you do?", "tip": "Falling pebbles and water gushing from slopes are warning signs of a landslide. Passing \"one at a time, quickly\" still gets you caught if it collapses. Low ground by the stream is where debris and water collect. Head toward the ridge.", "scene": {"type": "mountain", "rain": 3, "depth": 0, "alert": "l3", "extra": ["rockfall"]}}, "2b": {"c": [{"t": "Don't move carelessly; shelter from the wind and rain with an emergency tent in a safe spot, and call for rescue where you get a signal", "s": 2}, {"t": "Prioritize getting down before dark, share the injured friend's load, and slowly go back the way you came", "s": 1}, {"t": "With poor visibility, descend by the streamside route, where it's harder to get lost", "s": 0}], "sit": "Near the summit, <b>Alert Level 3</b> is issued. With rain and fog, visibility is 10 m and there's no signal. A companion slipped and twisted an ankle.", "q": "What do you do?", "tip": "Moving with poor visibility and an injured person leads to getting lost. Even if the streamside trail is easy to follow, flooding is a serious risk. Make an emergency bivouac and call for rescue early.", "scene": {"type": "mountain", "rain": 3, "depth": 0, "alert": "l3", "extra": ["fog"]}}, "3g": {"c": [{"t": "Treat it as a debris-flow warning sign and immediately move higher and farther from the stream", "s": 2}, {"t": "Take it as a sign the rain is easing, keep waiting where you are, and pack up your things", "s": 1}, {"t": "Now that the water is low, it's a chance to cross. Secure yourselves with a rope, cross the stream, and descend", "s": 0}], "sit": "While you wait in a safe spot, a <b>Landslide Alert</b> is issued. You hear a rumbling from a nearby stream, and even though the rain continues, its water level suddenly drops.", "q": "What do you do?", "tip": "If a stream suddenly drops while rain continues, debris may be damming it upstream — a dangerous sign right before a debris flow. Don't mistake it for \"the rain is easing\" or \"a chance to cross.\"", "scene": {"type": "mountain", "rain": 4, "depth": 30, "alert": "dosha", "extra": ["stream"]}}, "3m": {"c": [{"t": "Don't cross the collapsed area; wait in a safe spot and call for rescue", "s": 2}, {"t": "The rain has packed the debris down. Cross it carefully one at a time, testing your footing with trekking poles", "s": 1}, {"t": "To avoid the collapse, detour down into the valley while checking a map app", "s": 0}], "sit": "As you keep descending, a <b>Landslide Alert</b> is issued. Ahead on your route, a landslide has buried the trail.", "q": "What do you do?", "tip": "Slopes that have collapsed once tend to collapse again, and rain-soaked debris is unstable underfoot. Detouring into the valley puts you in the path of debris flows.", "scene": {"type": "mountain", "rain": 4, "depth": 0, "alert": "dosha", "extra": ["rockfall"]}}, "3b": {"c": [{"t": "Climb the slope away from the stream, and wait for rescue in a high place", "s": 2}, {"t": "Decide the mountain-side edge of the trail, 2–3 m above the water, is safe, and keep descending carefully", "s": 1}, {"t": "The roar of the water drowns out other sounds, so wait behind a big rock for more information", "s": 0}], "sit": "While you're beside the stream, a <b>Landslide Alert</b> is issued. The stream overflows and turns the trail into a river.", "q": "What do you do?", "tip": "Streams are paths for flash floods and debris flows. Being only a little above the water is not safe. The rule is to gain elevation and get away from the stream.", "scene": {"type": "mountain", "rain": 4, "depth": 30, "alert": "dosha", "extra": ["stream"]}}, "4g": {"c": [{"t": "While you have a signal, call 110 or 119 with your location (latitude/longitude), headcount, and gear, then power off to save battery", "s": 2}, {"t": "First tell your family what's happening and have them call the police for you", "s": 1}, {"t": "Turn off your phone to save battery, and call for rescue once it's light and the signal is stable", "s": 0}], "sit": "Night falls while you're on high ground. Your phone battery is at 20%. You get a signal now and then.", "q": "What do you do?", "tip": "For mountain emergencies, call 110 or 119 directly. Going through family makes information less accurate and takes longer. Use the signal while you have it, give your exact location, then save power.", "scene": {"type": "mountain", "rain": 4, "depth": 0, "alert": "dosha", "extra": ["phone"]}}, "4m": {"c": [{"t": "Block the wind and rain with an emergency tent or rain gear, change into dry clothes, and huddle together to stay warm", "s": 2}, {"t": "Save your dry clothes for tomorrow's hike, and block the wind with rain gear and an emergency tent over your wet clothes", "s": 1}, {"t": "Before hypothermia sets in, descend carefully by headlamp and get back to the car", "s": 0}], "sit": "Night falls, and it's too hard to keep moving. The rain and wind are strong, and your companion is shivering. It's 10°C.", "q": "What do you do?", "tip": "Even in summer mountains, wet clothes and wind cause hypothermia. Dry clothes are for now — staying in wet clothes keeps draining your heat. Moving at night risks getting lost or falling.", "scene": {"type": "mountain", "rain": 4, "depth": 0, "alert": "dosha", "extra": []}}, "4b": {"c": [{"t": "Run with all your strength sideways to the flow, to any spot even slightly higher", "s": 2}, {"t": "Get to the uphill side of a big tree trunk nearby and cling to it for protection", "s": 1}, {"t": "Sprint down the trail, which is easy to run on, in the downstream direction", "s": 0}], "sit": "Just then, a <b>debris flow</b> roars down from upstream toward you.", "q": "What do you do?", "tip": "Debris flows can travel tens of kilometers per hour — you can't outrun them. Escape sideways to the flow and uphill. Even large trees can be knocked down.", "scene": {"type": "mountain", "rain": 4, "depth": 40, "alert": "dosha", "extra": ["stream", "debris"]}}, "5g": {"c": [{"t": "Wait in an open area, and wave brightly colored clothing or cloth to show your location", "s": 2}, {"t": "Move a little along the ridge to find a wide area where the helicopter can land easily", "s": 1}, {"t": "The weather has cleared, so head down a bit to make it easier to meet the rescue team", "s": 0}], "sit": "The next morning the rain stops, and the rescue team says, \"We're sending a helicopter.\"", "q": "What do you do?", "tip": "Moving after rescue is on the way makes you hard to find. Don't decide on your own to move \"to a landing spot\" or \"to meet them.\" Stay put and make a visible signal.", "scene": {"type": "mountain", "rain": 0, "depth": 0, "alert": "stop", "extra": []}}, "5m": {"c": [{"t": "One person stays to keep them warm while another goes by a safe route to a place with a signal to call for rescue", "s": 2}, {"t": "Moving together is safer, so take turns carrying your companion to a place with a signal", "s": 1}, {"t": "To keep them conscious, shake them or make them walk so they don't fall asleep", "s": 0}], "sit": "In the morning, the rain eases. One companion is drifting in and out of consciousness. There's no signal.", "q": "What do you do?", "tip": "Never leave someone with impaired consciousness alone, and don't let the whole group overexert itself. Carrying and jostling a hypothermic person, or making them walk, can strain the heart dangerously.", "scene": {"type": "mountain", "rain": 1, "depth": 0, "alert": "stop", "extra": []}}, "5b": {"c": [{"t": "Wait in a safe, high spot, and try to call for rescue whenever you get a signal", "s": 2}, {"t": "To be easier to find, traverse the slope to a nearby forest road you found on the map", "s": 1}, {"t": "The debris-flow path is wide open, so follow it down to the road at the foot of the mountain", "s": 0}], "sit": "You somehow survived the night, but the trail is cut off. The rain has eased.", "q": "What do you do?", "tip": "A debris-flow path can be hit again, and the ground is unstable. Traversing slopes also risks a fall. Don't move carelessly; wait for rescue.", "scene": {"type": "mountain", "rain": 0, "depth": 0, "alert": "stop", "extra": []}}}}, {"id": "sea", "icon": "🎣", "title": "Fishing at sea", "desc": "Fishing on a breakwater as a typhoon approaches", "nodes": {"1": {"c": [{"t": "Stop fishing right away, leave the breakwater, and move to high ground far from the shore", "s": 2}, {"t": "The end is dangerous, so move to the base of the breakwater and keep fishing in your life jacket while watching the waves", "s": 1}, {"t": "Wear life jackets, assign a lookout, agree to retreat as soon as big swells appear, and keep fishing", "s": 0}], "sit": "A typhoon is approaching, but you're fishing at the end of a breakwater, thinking \"the fishing is best before it gets rough.\" The waves are still calm, but the swells are slowly getting bigger.", "q": "What do you do?", "tip": "As a typhoon approaches, big waves can come suddenly even when the sea looks calm. A lookout or a life jacket won't save you if a wave sweeps you away. Waves wash over the base of the breakwater too.", "scene": {"type": "sea", "rain": 1, "depth": 10, "alert": "typhoon", "extra": []}}, "2g": {"c": [{"t": "Avoid the low coastal road and take a route inland to high ground", "s": 2}, {"t": "Before traffic builds, take your usual shortest coastal route and get to high ground quickly", "s": 1}, {"t": "The car is safer than outside, so avoid traffic and wait in the parking lot until the warning is lifted", "s": 0}], "sit": "When you get back to your car, a <b>Storm Surge Warning</b> is issued. The coastal road runs through low ground.", "q": "What do you do?", "tip": "Storm surges raise the sea level greatly and flood low coastal land all at once. \"Getting through fast\" and \"waiting in the car\" both keep you by the sea. Get away from the sea and go to high ground.", "scene": {"type": "car", "rain": 2, "depth": 0, "alert": "takashio", "extra": []}}, "2m": {"c": [{"t": "Leave your gear, time it between waves, stay low, and get off the breakwater immediately", "s": 2}, {"t": "Quickly grab only your expensive rod and reel, then leave the breakwater between waves", "s": 1}, {"t": "Running on the breakwater can make you fall, so hold the railing, stay low, and wait for the waves to calm", "s": 0}], "sit": "As you keep fishing near the base, a <b>Storm Surge Warning</b> is issued. Now and then, big waves wash over the breakwater around your feet.", "q": "What do you do?", "tip": "Once waves wash over the breakwater, there's not a moment to lose. Expensive gear isn't worth your life. Holding a railing won't let you withstand a big wave. Time it between waves and head landward right away.", "scene": {"type": "sea", "rain": 2, "depth": 30, "alert": "takashio", "extra": ["highwave"]}}, "2b": {"c": [{"t": "Abandon your gear, support your friend on your shoulder, stay low, and move landward between waves right away", "s": 2}, {"t": "To keep the injury from worsening, splint the leg first, then move landward together", "s": 1}, {"t": "Moving an injured person is risky, so call 119 and wait for the ambulance on the breakwater", "s": 0}], "sit": "As you keep fishing at the end, a <b>Storm Surge Warning</b> is issued. Suddenly, a huge wave crashes over the breakwater, and your friend falls and hurts a leg.", "q": "What do you do?", "tip": "When waves wash over the breakwater, the next wave could sweep everyone away. First aid and ambulances come after you reach safety. Even with an injured person, head landward first.", "scene": {"type": "sea", "rain": 2, "depth": 40, "alert": "takashio", "extra": ["highwave"]}}, "3g": {"c": [{"t": "Don't drive into the flooded road; turn back, choose a high road, and head to an evacuation site on high ground", "s": 2}, {"t": "Turning back may mean more flooded roads, so drive slowly and steadily through the short, shallow flooded stretch", "s": 1}, {"t": "Driving in floodwater is dangerous, so park by the road and wait under the eaves of a nearby house for the water to recede", "s": 0}], "sit": "As you drive inland, a low coastal neighborhood starts to flood, <b>about 20 cm deep</b>. <b>Alert Level 4 (Evacuation Order)</b> has also been issued.", "q": "What do you do?", "tip": "Storm-surge flooding deepens fast. \"The flooded stretch is short\" and \"waiting under eaves\" both keep you on low ground. Don't drive into flooded roads; take high roads to high ground.", "scene": {"type": "car", "rain": 3, "depth": 20, "alert": "l4", "extra": []}}, "3m": {"c": [{"t": "Move away from the sea right away and head for high ground", "s": 2}, {"t": "Close the windows and move the car to the landward back of the lot, out of reach of the spray, and wait", "s": 1}, {"t": "Your wallet and phone are on the breakwater, so dash back between waves to get them", "s": 0}], "sit": "<b>Alert Level 4</b> is issued. Spray is reaching the seaside parking lots and roads, and seawater is starting to flow in.", "q": "What do you do?", "tip": "Low seaside areas flood all at once from storm surges and high waves. The back of the lot is still by the sea. Get away from the sea immediately.", "scene": {"type": "sea", "rain": 3, "depth": 40, "alert": "l4", "extra": ["highwave"]}}, "3b": {"c": [{"t": "Don't go near — throw in something that floats, like a cooler box, and call 118 (Japan Coast Guard)", "s": 2}, {"t": "Go back to your car, call 118, and keep the person lit up with your headlights to show where they are", "s": 1}, {"t": "To make sure it reaches them, climb down onto the tetrapods and hand them a floating object", "s": 0}], "sit": "The waves grow even bigger, washing over the breakwater and the seaside parking lot. Just then, another angler nearby is swept off by a wave and falls into the sea! <b>Alert Level 4</b> is issued.", "q": "What do you do?", "tip": "Approaching the sea or climbing onto tetrapods to help is a classic secondary disaster. But staying in a seaside parking lot that waves are washing over is dangerous too. Throw something that floats, call 118, then get to safety right away.", "scene": {"type": "sea", "rain": 3, "depth": 40, "alert": "l4", "extra": ["highwave"]}}, "4g": {"c": [{"t": "Tell them the expected flood depth, explain the 2nd floor may not be safe, and strongly urge them to evacuate to high ground now with neighbors' help", "s": 2}, {"t": "Moving at night is risky, so tell them to stay as high as possible on the 2nd floor and call 119 if it gets dangerous", "s": 1}, {"t": "There's still time before high tide, so drive over to pick them up and evacuate to high ground together", "s": 0}], "sit": "You reached an evacuation site on high ground. High tide is approaching. You reach your elderly parents, who live by the sea, and they say, \"We'll be fine on the 2nd floor.\"", "q": "What do you do?", "tip": "Storm-surge damage grows when it coincides with high tide. Depending on the expected flood depth, even the 2nd floor can be dangerous. Moving at night is risky, but going to get them yourself is riskier. Push for early evacuation with neighbors' help.", "scene": {"type": "shelter", "rain": 4, "depth": 0, "alert": "l4", "extra": ["phone"]}}, "4m": {"c": [{"t": "Leave right away and evacuate away from the waves to a tall building or high ground", "s": 2}, {"t": "Move the car to higher ground before it's swept away, then evacuate on foot from there", "s": 1}, {"t": "Open the door a crack, stay in the car, and wait for the water to go down", "s": 0}], "sit": "While you hesitate, the flooding spreads to <b>about 30 cm deep</b>. Cars nearby are starting to float and rock.", "q": "What do you do?", "tip": "When cars start rocking, they're beginning to float. Trying to move your car or staying inside it is extremely dangerous. Put your life first and get to high ground now.", "scene": {"type": "car", "rain": 4, "depth": 30, "alert": "l4", "extra": []}}, "4b": {"c": [{"t": "Stay low, hold onto railings and pillars, and move landward away from the waves to a tall building", "s": 2}, {"t": "Wait for a wave to pull back, then sprint to a tall building on the land side", "s": 1}, {"t": "Cling to a utility pole nearby so you won't be swept away, and wait for the waves to calm", "s": 0}], "sit": "The storm surge sends seawater rushing in, and you're waist-deep, about to be swept away. <b>Alert Level 5 (Emergency Safety Measure)</b> has been issued.", "q": "What do you do?", "tip": "Running through waves makes you likely to fall. Even utility poles may not withstand the waves. Stay low and work your way landward to high ground by holding onto things.", "scene": {"type": "sea", "rain": 4, "depth": 50, "alert": "l5", "extra": ["highwave"]}}, "5g": {"c": [{"t": "Confirm the storm-surge and high-wave warnings are lifted and coastal roads are safe before acting", "s": 2}, {"t": "The warning has been downgraded to an advisory, so carefully go collect your gear from the breakwater without getting too close to the sea", "s": 1}, {"t": "Even with swells remaining, the base of the breakwater is safe, so resume fishing while the fish are biting after the typhoon", "s": 0}], "sit": "The typhoon has passed, and blue skies spread out.", "q": "What do you do?", "tip": "Even after a typhoon passes, strong winds from the other direction and swells remain. A downgrade to an advisory doesn't mean \"safe.\" Confirm warnings and advisories are lifted before going near the sea.", "scene": {"type": "shelter", "rain": 0, "depth": 0, "alert": "stop", "extra": []}}, "5m": {"c": [{"t": "Don't start the engine; contact roadside assistance and your insurer", "s": 2}, {"t": "To prevent salt corrosion, rinse the car inside and out with tap water right away, then take it to the dealer", "s": 1}, {"t": "Just checking whether it runs should be fine, so start the engine and turn it off right away", "s": 0}], "sit": "The typhoon has passed. Your family's car was submerged in seawater.", "q": "What do you do?", "tip": "Salt water easily short-circuits electrical systems, and car fires can break out hours or days later. Don't rinse it yourself or start the engine even briefly — leave it to professionals.", "scene": {"type": "shelter", "rain": 0, "depth": 0, "alert": "stop", "extra": []}}, "5b": {"c": [{"t": "See a doctor to check for low body temperature and water in your lungs", "s": 2}, {"t": "You have no symptoms now, so stay with your family tonight and see a doctor right away if a cough or fever appears", "s": 1}, {"t": "Warming up and resting should be enough, so take a hot bath and go to bed early", "s": 0}], "sit": "The typhoon has passed. You made it, but you're soaked and you swallowed some seawater.", "q": "What do you do?", "tip": "After swallowing seawater, pneumonia and other problems can appear later. See a doctor early even without symptoms. A hot bath puts strain on your body.", "scene": {"type": "shelter", "rain": 0, "depth": 0, "alert": "stop", "extra": []}}}}, {"id": "chika", "icon": "🚇", "title": "In an underground mall", "desc": "Shopping in a downtown underground mall", "nodes": {"1": {"c": [{"t": "Stop shopping and immediately move to an upper floor of a sturdy building above ground", "s": 2}, {"t": "Ask staff about evacuation routes, then wait in the spot closest to an exit inside the underground mall", "s": 1}, {"t": "To avoid walking outside, go home by the sturdy, staffed subway", "s": 0}], "sit": "While you're shopping in a downtown underground mall, your phone receives a <b>Record Short-Term Heavy Rain Information</b> alert. Above ground, it's raining nearly 100 mm per hour. The underground mall still looks normal.", "q": "What do you do?", "tip": "This alert signals that flooding can spread rapidly. Once underground areas flood, there's no escape — even near an exit. Subway stations become channels for water too. Go to an upper floor of a sturdy building above ground.", "scene": {"type": "underground", "rain": 2, "depth": 0, "alert": "kiroku", "extra": []}}, "2g": {"c": [{"t": "Tell them to evacuate above ground to an upper floor right away, and help them find an exit without water", "s": 2}, {"t": "Your friend doesn't know the area, so go down the entrance stairs to meet them and come up together", "s": 1}, {"t": "So your friend won't get lost, go to the underground mall's information desk to meet them and find a safe exit together", "s": 0}], "sit": "You evacuated to the 3rd floor of a building above ground. From the window, overflowing water is running like a river into the underground mall entrances. A friend messages you: \"I'm in a shop in the underground mall.\"", "q": "What do you do?", "tip": "Underground flooding progresses quickly, and water pours down stairs like a waterfall. If you go down to meet them, you may get trapped too. Guide them from above ground by telling them which exit to use.", "scene": {"type": "office", "rain": 3, "depth": 20, "alert": "l3", "extra": []}}, "2m": {"c": [{"t": "Find an exit without water pouring in, get above ground right away, and evacuate to an upper floor", "s": 2}, {"t": "Staff know the evacuation routes, so wait in the shop for their evacuation guidance and follow it", "s": 1}, {"t": "The stairs with water pouring down are dangerous, so take the elevator deep inside the mall up to street level", "s": 0}], "sit": "While you wait underground, rainwater starts pouring down the stairs. A thin layer of water is gathering on the floor.", "q": "What do you do?", "tip": "Once water starts pouring underground, things get worse in minutes. There's no time to wait for guidance. Elevators can trap you during flooding. Take the stairs up from an exit without water.", "scene": {"type": "underground", "rain": 3, "depth": 10, "alert": "l3", "extra": []}}, "2b": {"c": [{"t": "Without fighting the crowd, exit above ground from the nearest exit without water, and evacuate upstairs", "s": 2}, {"t": "The gates are crowded and dangerous, so wait in a higher passage inside the station until the crowd thins", "s": 1}, {"t": "This station's exits are crowded, so take the underground passage and exit from the next station", "s": 0}], "sit": "As you head to the subway station, rainwater is flowing in near the ticket gates, and service is suspended. The underground passages are crowded with people rushing home.", "q": "What do you do?", "tip": "Subway stations become channels for floodwater. While you wait out the crowd or move to another station underground, the flooding advances. Go with the flow of people and exit from the nearest exit.", "scene": {"type": "underground", "rain": 3, "depth": 10, "alert": "l3", "extra": []}}, "3g": {"c": [{"t": "Take the stairs to an upper floor and follow the building manager's instructions", "s": 2}, {"t": "It's dark, so first get a flashlight and drinks from the 1st-floor kiosk, then go upstairs", "s": 1}, {"t": "Upstairs is crowded, so while the water is still shallow, get emergency supplies from the basement storeroom", "s": 0}], "sit": "You're in a building above ground. <b>Alert Level 4</b> is issued. Water starts entering the building's 1st floor, and the power goes out.", "q": "What do you do?", "tip": "In blackouts and flooding, go upstairs right away. Going down to the 1st floor or basement for supplies risks being trapped or submerged.", "scene": {"type": "office", "rain": 4, "depth": 30, "alert": "l4", "extra": []}}, "3m": {"c": [{"t": "Grip the handrail and climb one step at a time on the wall side where the flow is weaker; if it's impossible, go to another exit", "s": 2}, {"t": "Wait for a moment when the flow weakens, then dash up the wide middle section without a handrail", "s": 1}, {"t": "Rather than climbing, retreat to an underground area with less water and wait for the flow to weaken", "s": 0}], "sit": "When you head for the stairs to get above ground, water is pouring down them like a waterfall. The water is above your ankles.", "q": "What do you do?", "tip": "Water flowing down stairs is stronger than it looks and can knock adults off their feet. Dashing up the middle without a handrail is dangerous. Staying underground is the most dangerous choice.", "scene": {"type": "underground", "rain": 4, "depth": 30, "alert": "l4", "extra": []}}, "3b": {"c": [{"t": "Move along the walls and handrails to another exit and head above ground", "s": 2}, {"t": "Rather than waiting at the door, dash up the nearby emergency stairs against the flow", "s": 1}, {"t": "Doors can open if people push together, so everyone pushes the door at once", "s": 0}], "sit": "As you move through the underground, the water rises to just below your knees. Ahead, someone shouts, \"The exit door won't open because of the water pressure!\"", "q": "What do you do?", "tip": "Even tens of centimeters of water can keep doors from opening, even with many people pushing. Stairs with water pouring down are dangerous too. Move along walls and handrails to another exit.", "scene": {"type": "underground", "rain": 4, "depth": 30, "alert": "l4", "extra": []}}, "4g": {"c": [{"t": "Stay on the building's upper floor, and wait for the water to drop while checking official information", "s": 2}, {"t": "Go out on the roof to check the flooding around you so you can report it to rescuers", "s": 1}, {"t": "Take a rope down to the 1st floor to help people stranded near the entrance", "s": 0}], "sit": "You've evacuated to an upper floor of a building above ground. <b>Alert Level 5 (Emergency Safety Measure)</b> is issued. Outside the window, the underground mall entrances are completely under water.", "q": "What do you do?", "tip": "In torrential rain, rooftops carry risks of lightning and falls. Going down to the 1st floor to rescue people causes secondary disasters. Wait on a safe upper floor and call for rescue.", "scene": {"type": "office", "rain": 4, "depth": 50, "alert": "l5", "extra": []}}, "4m": {"c": [{"t": "Use the stairs and move to an upper floor of the nearest sturdy building", "s": 2}, {"t": "Head for the designated shelter, which has supplies and information, moving along the edge of the sidewalk where the current is weaker", "s": 1}, {"t": "The current is strong outside, so go back into the subway station, which has a roof, and wait", "s": 0}], "sit": "At street level (the 1st floor), water is flowing in up to your waist. Upper floors of sturdy buildings are close by.", "q": "What do you do?", "tip": "Traveling far on flooded roads is dangerous. If the designated shelter is far away, the upper floor of a nearby sturdy building is your emergency refuge. Going back underground is the most dangerous choice.", "scene": {"type": "office", "rain": 4, "depth": 40, "alert": "l4", "extra": []}}, "4b": {"c": [{"t": "Use your phone light to read the signs near the ceiling, and move along the wall to an exit", "s": 2}, {"t": "Moving in the dark is dangerous, so hold onto something that floats by the wall, save your strength, and wait for rescue", "s": 1}, {"t": "You remember where the exit is, so dive under and swim the shortest route to it", "s": 0}], "sit": "Underground, the water is chest-high. The lights go out, and it's pitch black.", "q": "What do you do?", "tip": "In an underground blackout, you lose your sense of direction, but the water keeps rising. There's no time to wait. Use signs and walls to find an exit. Swimming underwater is extremely dangerous.", "scene": {"type": "underground", "rain": 4, "depth": 60, "alert": "l4", "extra": []}}, "5g": {"c": [{"t": "Don't go underground until managers finish safety checks; go home by an above-ground route", "s": 2}, {"t": "Decide areas where the lights are back and the water is gone are safe, and go get the bag you left underground", "s": 1}, {"t": "Streets have mud and sinkholes, so take the drained underground passage to the station", "s": 0}], "sit": "The rain stops, and the water starts to recede. Muddy water remains in the underground mall.", "q": "What do you do?", "tip": "After the water recedes, underground areas may have oxygen shortages, toxic gases, or electric-shock hazards. Even if the lights are back on, don't enter until managers finish safety checks.", "scene": {"type": "office", "rain": 0, "depth": 20, "alert": "stop", "extra": []}}, "5m": {"c": [{"t": "Wash and disinfect the wound, and see a doctor early", "s": 2}, {"t": "The cut is shallow, so wash and disinfect it, put on a bandage, and see how it goes", "s": 1}, {"t": "To keep dirt out, seal the wound tightly with tape right away", "s": 0}], "sit": "You made it through the night. In the morning the water is gone, but you're wet with dirty water and have a cut on your shin.", "q": "What do you do?", "tip": "Floodwater is mixed with sewage, and even small wounds can lead to infections such as tetanus. Don't treat or seal it yourself; see a doctor early.", "scene": {"type": "office", "rain": 0, "depth": 10, "alert": "stop", "extra": []}}, "5b": {"c": [{"t": "Tell the rescue team where your acquaintance might be and what they were wearing, and leave the search to them", "s": 2}, {"t": "Keep calling your acquaintance's phone, and if you get through, ask where they are and tell the rescuers", "s": 1}, {"t": "Drained areas are less dangerous, so check the shops where they might be before the rescuers do", "s": 0}], "sit": "You were rescued. You can't reach an acquaintance you'd planned to meet in the underground mall; they may still be underground.", "q": "What do you do?", "tip": "To prevent secondary disasters, leave searching to professionals. Calling repeatedly drains the other person's battery. Accurate information is the biggest help.", "scene": {"type": "underground", "rain": 0, "depth": 30, "alert": "stop", "extra": []}}}}, {"id": "camp", "icon": "⛺", "title": "Camping on a river sandbar", "desc": "Summer vacation camping on a sandbar in a river", "nodes": {"1": {"c": [{"t": "Pack up and leave the sandbar before dark, moving to high ground away from the river", "s": 2}, {"t": "Finish dinner early and get everything ready so you can pack up right away before dark", "s": 1}, {"t": "The sandbar is higher than its surroundings and a popular campsite, so pack up once the water starts rising", "s": 0}], "sit": "On summer vac /* 効果音 */
const AU={ctx:null,on:true,timer:null};
function audioInit(){
  try{
    if(!AU.ctx){
      const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
      const ctx=AU.ctx=new C();
      const len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      AU.noise=buf; AU.master=ctx.createGain(); AU.master.connect(ctx.destination); AU.master.gain.value=AU.on?1:0;
      const mk=(type,freq,q)=>{const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=ctx.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(AU.master);s.start();return g;};
      AU.rainG=mk("bandpass",2600,0.5); AU.heavyG=mk("lowpass",900,0.7); AU.waterG=mk("lowpass",320,1.2); AU.deepG=mk("lowpass",140,2.0);
    }
    if(AU.ctx.state!=="running")AU.ctx.resume();
  }catch(e){}
}
function setAmbient(rain,depth){
  if(!AU.ctx)return; const t=AU.ctx.currentTime;
  AU.rainG.gain.setTargetAtTime([0,.05,.10,.16,.24][rain],t,.6);
  AU.heavyG.gain.setTargetAtTime([0,0,.05,.12,.22][rain],t,.6);
  AU.waterG.gain.setTargetAtTime(depth>=40?.55:depth>=15?.3:0,t,.6);
  AU.deepG.gain.setTargetAtTime(0,t,.3);
  clearInterval(AU.timer);
  if(rain>=3){AU.timer=setInterval(()=>{if(Math.random()<.55)thunder();},rain>=4?4500:7500);setTimeout(thunder,900);}
}
function stopAmbient(){if(!AU.ctx)return;clearInterval(AU.timer);const t=AU.ctx.currentTime;[AU.rainG,AU.heavyG,AU.waterG,AU.deepG].forEach(g=>g.gain.setTargetAtTime(0,t,.3));}
function thunder(){
  flash(); if(!AU.ctx)return; const ctx=AU.ctx,t=ctx.currentTime+.25;
  const s=ctx.createBufferSource();s.buffer=AU.noise;const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(120,t+2.5);
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.9,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+3.2);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);s.stop(t+3.3);
}
function flash(){const f=document.querySelector(".screen.active .flash");if(!f)return;f.classList.add("on");setTimeout(()=>f.classList.remove("on"),90);setTimeout(()=>f.classList.add("on"),180);setTimeout(()=>f.classList.remove("on"),260);}
function tone(freq,start,dur,type="square",vol=.12){
  const ctx=AU.ctx,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,start);g.gain.linearRampToValueAtTime(vol,start+.02);g.gain.setValueAtTime(vol,start+dur-.03);g.gain.linearRampToValueAtTime(0,start+dur);
  o.connect(g);g.connect(AU.master);o.start(start);o.stop(start+dur);
}
function alarm(kind){
  if(!AU.ctx||!kind)return; const t=AU.ctx.currentTime+.1;
  if(["l3","l4","l5","dosha","takashio","kiroku"].includes(kind)){const n=kind==="l3"?4:6;for(let i=0;i<n;i++){tone(i%2?740:990,t+i*.32,.3,"square",kind==="l3"?.1:.13);}}
  else if(kind==="dam"){const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.type="sawtooth";o.frequency.setValueAtTime(420,t);o.frequency.linearRampToValueAtTime(880,t+1.5);o.frequency.linearRampToValueAtTime(420,t+3);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.3);g.gain.linearRampToValueAtTime(0,t+3);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+3.1);}
  else if(kind==="stop"){[660,880].forEach((f,i)=>tone(f,t+i*.25,.3,"sine",.12));}

function buildSVG(sc){
  UID++;
  const ex=sc.extra||[], night=ex.includes("night");
  let bg=sky(sc.rain,night), body="", own=false, fg="";
  switch(sc.type){
    case "house":body=ground()+house();break;
    case "office":body=ground()+office();break;
    case "school":body=ground()+school();break;
    case "park":{const r=ex.find(e=>/^r\d$/.test(e));body=ground("park")+park(r?+r[1]:0);break;}
    case "shelter":body=ground()+shelter()+person(250,G,"#2a9d8f");break;
    case "underpass":body=underpass()+car(40,G,false);break;
    case "car":body=ground()+car(220,G+20,ex.includes("stall"));break;
    case "train":body=train(sc);break;
    case "themepark":body=ground("themepark")+themepark();break;
    case "mall":body=ground()+mall();break;
    case "underground":bg="";body=underground(sc);break;
    case "room":bg="";body=room(sc);own=true;break;
    case "river":body=river(sc);own=true;break;
    case "mountain":body=mountain(sc);own=true;break;
    case "sea":body=sea(sc);own=true;break;
    case "camp":body=camp(sc);own=true;break;
  }
  if(sc.type==="house"&&!ex.length&&sc.depth<50)fg+=person(250,G)+(sc.rain?umbrella(250,G):"");
  if(sc.type==="office"&&!ex.length)fg+=person(260,G,"#264653");
  if(sc.type==="school")fg+=person(220,G,"#e76f51",.8)+person(180,G,"#2a9d8f",.85);
  if(sc.type==="themepark")fg+=person(330,G,"#e76f51",.8)+person(360,G,"#264653")+(sc.rain?umbrella(360,G):"");
  if(sc.type==="mall")fg+=person(300,G,"#264653");
  if(sc.type==="underground"&&!ex.includes("car"))fg+=person(300,G,"#ff8a00");
  if(sc.type==="park"&&!ex.includes("walker"))fg+=person(230,G,"#e76f51",.85);
  if(ex.includes("walker"))fg+=person(230,G)+`<line x1="246" y1="${G-50}" x2="262" y2="${G+4}" stroke="#333" stroke-width="3"/>`;
  if(ex.includes("grandma"))fg+=grandma();
  if(ex.includes("hazard"))fg+=hazardMap();
  if(ex.includes("breaker"))fg+=breaker();
  if(ex.includes("phone"))fg+=phone();
  const nightOv=night?`<rect width="${W}" height="${H}" fill="#000" opacity=".35"/>`:"";
  const wtr=own?"":water(sc.depth);
  const rainOut=(sc.type==="underground"||sc.type==="room")?"":rainLines(sc.rain);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${bg}${body}${fg}${nightOv}${wtr}${rainOut}${alertBox(sc.alert)}<rect class="flash" width="${W}" height="${H}" fill="#fff"/></svg>`;
}

  go("s-select");
}
function startQuiz(i){audioInit();cur=DATA[LV][i];stage=1;nodeKey="1";path=[];go("s-quiz");render();}
function render(){
  const n=cur.nodes[nodeKey],U=UI[LV];
  setT("q-sc",`${cur.icon} ${cur.title}`); setT("q-no",U.qno.replace("{i}",stage).replace("{n}",5));
  document.getElementById("q-bar").style.width=`${(stage-1)/5*100}%`;
  showScene(document.getElementById("q-scene"),n.scene,VIDEOS[`${cur.id}-${nodeKey}`]);
  setT("q-sit",n.sit); setT("q-text","Q. "+n.q);
  const lbs=["A","B","C"];
  document.getElementById("q-choices").innerHTML=shuffle([0,1,2]).map((ci,k)=>
    `<button class="choice" data-i="${ci}"><span class="lb">${lbs[k]}</span><span data-raw="${esc(n.c[ci].t)}">${rb(n.c[ci].t)}</span></button>`).join("");
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  window.scrollTo(0,0);
}
function pick(ci){
  audioInit(); const n=cur.nodes[nodeKey], c=n.c[ci]; path.push({n,c});
  if(stage<5){ stage++; nodeKey=stage+["b","m","g"][c.s]; render(); } else showResult();
}
function showResult(){
  const U=UI[LV], score=path.reduce((a,x)=>a+x.c.s*10,0), pass=score>=PASS[LV];
  const head=document.getElementById("r-head"); head.className="result-head "+(pass?"pass":"fail");
  const vtxt=pass?(score===100?U.perfect:U.ok):U.ng, mtxt=pass?U.okMsg:U.ngMsg, ttl=cur.icon+' '+cur.title;
  head.innerHTML=`<div style="font-size:20px" data-raw="${esc(ttl)}">${rb(ttl)}</div><div class="score">${score}<small> / 100<span data-raw="${esc(U.unit)}">${rb(U.unit)}</span></small></div>
   <div class="verdict" data-raw="${esc(vtxt)}">${rb(vtxt)}</div><div class="warn" data-raw="${esc(mtxt)}">${rb(mtxt)}</div>`;
  const mk={2:["g","○"],1:["m","△"],0:["b","×"]};
  document.getElementById("r-list").innerHTML=path.map(({n,c},i)=>{
    const best=n.c.find(x=>x.s===2).t,[cls,sym]=mk[c.s];
    const line1=U.line1.replace("{q}",U.qlabel.replace("{i}",i+1)).replace("{a}",c.t).replace("{p}",c.s*10);
    const line2=c.s===2?`<span style="color:#1e9e5a">${U.correct}</span> ${n.tip}`:`<span class="adv">▶ ${U.bestF.replace("{b}",best)}</span><br>${LV==="easy"?"💡 ":""}${n.tip}`;
    const sit=n.sit.replace(/<[^>]+>/g,'');
    return `<div class="rv"><div class="mk ${cls}">${sym}</div><div><span class="sit" data-raw="${esc(sit)}">${rb(sit)}</span><b data-raw="${esc(line1)}">${rb(line1)}</b><br><span data-raw="${esc(line2)}">${rb(line2)}</span></div></div>`;}).join("");
  document.getElementById("q-bar").style.width="100%";
  playDrama(pass,()=>{ go("s-result"); if(AU.ctx){const t=AU.ctx.currentTime+.1;(pass?[523,659,784,1047]:[392,330,262]).forEach((f,i)=>tone(f,t+i*.18,.25,"sine",.15));} });
}
document.getElementById("hero").innerHTML=buildSVG(HERO);
refreshText();
</script>
</body>
